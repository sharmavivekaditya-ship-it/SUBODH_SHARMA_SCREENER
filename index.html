<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse Pro — NSE Trading Screen</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0b0e13; --panel: #12161d; --panel2: #171c24; --border: #262c36;
    --text: #dde3ea; --muted: #7d8590; --green: #26a69a; --red: #ef5350;
    --accent: #2962ff; --hl: #1c2230;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

  /* ===== Top toolbar ===== */
  #bar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; z-index: 20; }
  #bar h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
  #bar h1 span { color: var(--accent); }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 9px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.open { color: var(--green); border-color: var(--green); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 4px 9px; font-size: 11px; cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .ctl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  select, input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 11px; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  .tgl { font-size: 10px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .tgl.on { color: var(--accent); border-color: var(--accent); }
  #watchlistBox { display: none; } #watchlistInput { width: 260px; }
  #status { font-size: 10px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  #status b { color: var(--text); font-weight: 500; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 5px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ===== Ticker strip ===== */
  #strip { display: flex; gap: 6px; overflow-x: auto; padding: 5px 12px; background: var(--panel); border-bottom: 1px solid var(--border); scrollbar-width: none; flex: none; }
  #strip::-webkit-scrollbar { display: none; }
  .chip { display: flex; gap: 5px; align-items: baseline; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 5px; white-space: nowrap; cursor: pointer; }
  .chip:hover { background: var(--hl); }
  .chip .sym { font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }

  /* ===== Main: sidebar + chart grid ===== */
  #main { flex: 1; display: flex; min-height: 0; }
  #side { width: 355px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #side h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 8px 12px 4px; }
  #tblWrap { flex: 1; overflow-y: auto; scrollbar-width: thin; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  thead th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-size: 9.5px; text-transform: uppercase; padding: 5px 6px; text-align: right; cursor: pointer; user-select: none; white-space: nowrap; z-index: 5; }
  thead th:first-child { text-align: left; padding-left: 12px; }
  thead th.sorted { color: var(--accent); }
  tbody td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #161b22; }
  tbody td:first-child { text-align: left; padding-left: 12px; font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hl); }
  tbody tr.live td:first-child { border-left: 2px solid var(--accent); padding-left: 10px; }

  #gridWrap { flex: 1; overflow: auto; padding: 10px; }
  #grid { display: grid; gap: 8px; justify-content: center; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  .card-head { display: flex; align-items: baseline; gap: 6px; padding: 5px 9px 2px; flex: none; }
  .card-head .sym { font-weight: 700; font-size: 12px; }
  .card-head .px { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  .card-head .chg { font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-head .max { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .card-head .max:hover { color: var(--text); }
  .chart-el { flex: 1; min-height: 0; }
  #msg { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }
  #msg.error { color: var(--red); }

  /* ===== Fullscreen modal ===== */
  #modal { display: none; position: fixed; inset: 0; background: rgba(4,6,10,.88); z-index: 50; padding: 3vh 3vw; }
  #modal.open { display: flex; flex-direction: column; }
  #modalCard { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #modalHead { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  #modalHead .sym { font-size: 17px; font-weight: 700; }
  #modalHead .name { font-size: 11px; color: var(--muted); }
  #modalLegend { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  #modalClose { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  #modalClose:hover { color: var(--text); }
  #modalChart { flex: 1; min-height: 0; }

  /* ===== Insights view ===== */
  #insights { flex: 1; overflow: auto; padding: 12px; display: none; }
  .ins-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 1250px; margin: 0 auto; }
  .ins-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .ins-card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .ins-card.wide { grid-column: 1 / -1; }
  .bt { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 11px; }
  .bt .lbl { width: 110px; color: var(--muted); flex: none; }
  .bt .track { flex: 1; height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bt .fill { height: 100%; }
  .bt .val { width: 84px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .adbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; font-size: 10px; color: #fff; }
  .hist { display: flex; align-items: flex-end; gap: 6px; height: 116px; margin-top: 8px; }
  .hbin { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: 9px; color: var(--muted); gap: 3px; }
  .hbin .bar { width: 100%; border-radius: 3px 3px 0 0; }
  table.rot { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .rot th { font-size: 9.5px; color: var(--muted); text-transform: uppercase; padding: 4px 6px; text-align: right; }
  .rot th:first-child { text-align: left; }
  .rot td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #161b22; }
  .rot td:first-child { text-align: left; font-weight: 600; }
  .hilist { font-size: 11px; column-count: 2; column-gap: 30px; }
  .hilist div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #161b22; break-inside: avoid; }
  @media (max-width: 900px) { #side { display: none; } body { overflow: auto; } .ins-grid { grid-template-columns: 1fr; } .hilist { column-count: 1; } }
</style>
</head>
<body>

<div id="bar">
  <h1>MARKET<span>PULSE</span></h1>
  <span class="badge" id="mktBadge">…</span>
  <div class="seg" id="viewSeg">
    <button data-v="charts" class="on">CHARTS</button><button data-v="insights">INSIGHTS</button>
  </div>
  <label class="ctl">
    <select id="mode">
      <option value="movers">Top Movers</option>
      <option value="gainers">Top Gainers</option>
      <option value="losers">Top Losers</option>
      <option value="watchlist">Watchlist</option>
    </select>
  </label>
  <label class="ctl">Charts <select id="count"></select></label>
  <div class="seg" id="tf">
    <button data-v="5d|5m|1" class="on">1D</button><button data-v="5d|15m">5D</button><button data-v="1mo|1h">1M</button><button data-v="3mo|1d">3M</button><button data-v="6mo|1d">6M</button><button data-v="1y|1wk">1Y</button>
  </div>
  <button class="tgl on" id="tglVol">VOL</button>
  <button class="tgl" id="tglS20">SMA20</button>
  <button class="tgl" id="tglS50">SMA50</button>
  <label class="ctl">⟳ <select id="interval">
    <option value="30">30s</option><option value="60" selected>60s</option><option value="120">2m</option><option value="300">5m</option>
  </select></label>
  <span class="ctl" id="watchlistBox"><input type="text" id="watchlistInput" placeholder="RELIANCE, TCS, HDFCBANK…"></span>
  <span id="status"></span>
</div>

<div id="strip"></div>

<div id="main">
  <div id="side">
    <h2>Screener — NSE F&amp;O Universe</h2>
    <div id="tblWrap">
      <table>
        <thead><tr id="thRow">
          <th data-k="sym">Symbol</th><th data-k="last">LTP</th><th data-k="d1" class="sorted">1D%</th>
          <th data-k="w1">1W%</th><th data-k="m1">1M%</th><th data-k="m3">3M%</th><th data-k="rsi">RSI</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div id="gridWrap">
    <div id="msg"><span class="spin"></span>Loading market data…</div>
    <div id="grid"></div>
  </div>
  <div id="insights"></div>
</div>

<div id="modal">
  <div id="modalCard">
    <div id="modalHead">
      <span class="sym" id="mSym"></span><span class="name" id="mName"></span>
      <span class="chg" id="mChg"></span>
      <span id="modalLegend"></span>
      <button id="modalClose">✕</button>
    </div>
    <div id="modalChart"></div>
  </div>
</div>

<script>
"use strict";
/* ================= Universe: Nifty 50 + liquid F&O (NSE) — edit freely ================= */
const UNIVERSE = [
  "RELIANCE","HDFCBANK","ICICIBANK","INFY","TCS","BHARTIARTL","SBIN","AXISBANK",
  "KOTAKBANK","ITC","LT","HINDUNILVR","BAJFINANCE","MARUTI","M&M","SUNPHARMA",
  "NTPC","POWERGRID","TITAN","ULTRACEMCO","TATAMOTORS","TATASTEEL","JSWSTEEL",
  "ASIANPAINT","NESTLEIND","ADANIENT","ADANIPORTS","ONGC","COALINDIA","BAJAJFINSV",
  "HCLTECH","WIPRO","TECHM","GRASIM","DRREDDY","CIPLA","APOLLOHOSP","EICHERMOT",
  "HEROMOTOCO","BAJAJ-AUTO","BRITANNIA","TATACONSUM","HINDALCO","INDUSINDBK",
  "SBILIFE","HDFCLIFE","SHRIRAMFIN","TRENT","BEL","HAL","DLF","VEDL","JIOFIN",
  "PIDILITIND","AMBUJACEM","GAIL","IOC","BPCL","LICI","DMART"
];
const MAX_CHARTS = 12, METRICS_TTL = 4 * 60 * 1000, IST_OFF = 19800;

const S = {
  mode: "movers", count: 6, range: "5d", interval: "5m", clip: true, refreshSec: 60,
  watchlist: [], timer: null, sortKey: "d1", sortDir: -1,
  metrics: {}, metricsTime: 0, charts: {}, rows: [],
  showVol: true, showS20: false, showS50: false,
  apiOk: null, modalSym: null, snapIntraday: null, snapTime: 0, view: "charts"
};
const pool = new Map();   // sym -> {chart, series...} reused across refreshes
let modalChart = null;

/* ================= Data layer: one combined call, edge-cached ================= */
async function apiMarket(symbols, range, interval) {
  const qs = `symbols=${symbols.map(encodeURIComponent).join(",")}&range=${range}&interval=${interval}`;
  if (S.apiOk !== false) {
    try {
      const r = await fetch(`/api/market?${qs}`, { cache: "no-store" });
      if (r.ok) { S.apiOk = true; return (await r.json()).data; }
    } catch (_) {}
    if (S.apiOk === null) S.apiOk = false;
  }
  // Static-hosting fallback: per-symbol via public CORS proxy (slower)
  const out = {};
  const chunk = 8;
  for (let i = 0; i < symbols.length; i += chunk) {
    await Promise.all(symbols.slice(i, i + chunk).map(async s => {
      const sym = s.includes(".") ? s : s + ".NS";
      const y = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=${range}&interval=${interval}&includePrePost=false`;
      try {
        const r = await fetch("https://corsproxy.io/?url=" + encodeURIComponent(y));
        const j = await r.json();
        const c = j.chart && j.chart.result && j.chart.result[0];
        if (!c || !c.timestamp) return;
        const q = (c.indicators && c.indicators.quote && c.indicators.quote[0]) || {};
        out[s] = { t: c.timestamp, o: q.open || [], h: q.high || [], l: q.low || [], c: q.close || [], v: q.volume || [],
          meta: { prevClose: c.meta.chartPreviousClose ?? c.meta.previousClose, last: c.meta.regularMarketPrice,
                  name: c.meta.shortName || sym, high: c.meta.regularMarketDayHigh, low: c.meta.regularMarketDayLow } };
      } catch (_) {}
    }));
  }
  return out;
}

/* ================= Metrics (screener table): 1y daily data → returns + RSI ================= */
function rsi14(cl) {
  const p = 14;
  if (cl.length < p + 1) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = cl[i] - cl[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= p; l /= p;
  for (let i = p + 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1];
    g = (g * (p - 1) + Math.max(d, 0)) / p;
    l = (l * (p - 1) + Math.max(-d, 0)) / p;
  }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
const pctBack = (cl, n) => cl.length > n ? (cl[cl.length - 1] - cl[cl.length - 1 - n]) / cl[cl.length - 1 - n] * 100 : null;

async function loadMetrics(force) {
  const symbols = S.mode === "watchlist" && S.watchlist.length ? S.watchlist : UNIVERSE;
  if (!force && Object.keys(S.metrics).length && Date.now() - S.metricsTime < METRICS_TTL) return;
  const data = await apiMarket(symbols, "1y", "1d");
  const m = {};
  for (const [sym, d] of Object.entries(data)) {
    const cl = [];
    for (let i = 0; i < d.c.length; i++) if (d.c[i] != null) cl.push(d.c[i]);
    if (cl.length < 2) continue;
    const last = d.meta.last ?? cl[cl.length - 1];
    const prev = cl[cl.length - 2]; // yesterday's close (meta.prevClose on a 1y range = a year ago!)
    const smaN = n => cl.length >= n ? cl.slice(-n).reduce((a, b) => a + b, 0) / n : null;
    const s20v = smaN(20), s50v = smaN(50), s200v = smaN(200);
    m[sym] = {
      sym, last, name: d.meta.name,
      d1: prev ? (last - prev) / prev * 100 : null,
      w1: pctBack(cl, 5), m1: pctBack(cl, 21), m3: pctBack(cl, 63), m6: pctBack(cl, 126), y1: pctBack(cl, 251),
      rsi: rsi14(cl),
      a20: s20v != null ? last > s20v : null, a50: s50v != null ? last > s50v : null, a200: s200v != null ? last > s200v : null,
      hi52: (last / Math.max(...cl) - 1) * 100
    };
  }
  if (!Object.keys(m).length) throw new Error("metrics failed");
  S.metrics = m; S.metricsTime = Date.now();
  try { localStorage.setItem("mp_metrics", JSON.stringify({ m, t: Date.now() })) } catch (_) {}
}

function rankedRows() {
  let rows = Object.values(S.metrics);
  if (S.mode === "watchlist") {
    rows = rows.filter(r => S.watchlist.includes(r.sym));
    rows.sort((a, b) => S.watchlist.indexOf(a.sym) - S.watchlist.indexOf(b.sym));
    return rows;
  }
  const k = S.sortKey, dir = S.sortDir;
  rows.sort((a, b) => {
    if (k === "sym") return dir * a.sym.localeCompare(b.sym);
    const av = a[k] ?? -1e9, bv = b[k] ?? -1e9;
    return dir * (av - bv);
  });
  return rows;
}
function chartPicks(rows) {
  if (S.mode === "watchlist") return rows.slice(0, S.count);
  let r = [...rows];
  if (S.mode === "gainers") r.sort((a, b) => (b.d1 ?? -1e9) - (a.d1 ?? -1e9));
  else if (S.mode === "losers") r.sort((a, b) => (a.d1 ?? 1e9) - (b.d1 ?? 1e9));
  else r.sort((a, b) => Math.abs(b.d1 ?? 0) - Math.abs(a.d1 ?? 0));
  return r.slice(0, S.count);
}

/* ================= Server snapshot: precomputed by /api/refresh + cron ================= */
async function loadSnapshot() {
  if (S.apiOk === false) return false;
  try {
    const r = await fetch("/api/snapshot", { cache: "no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.metrics || Date.now() - j.ts > 6 * 60 * 1000) return false;
    if (S.mode === "watchlist" && S.watchlist.some(s => !j.metrics[s])) return false;
    S.metrics = j.metrics; S.metricsTime = j.ts;
    S.snapIntraday = j.intraday || null; S.snapTime = j.ts;
    try { localStorage.setItem("mp_metrics", JSON.stringify({ m: j.metrics, t: j.ts })) } catch (_) {}
    return true;
  } catch (_) { return false; }
}

/* ================= Refresh cycle ================= */
let busy = false;
async function refresh(force) {
  if (busy) return; busy = true;
  setStatus('<span class="spin"></span>updating…');
  try {
    const snapped = await loadSnapshot();
    if (!snapped) await loadMetrics(force);
    S.rows = rankedRows();
    const picks = chartPicks(S.rows);
    let data;
    if (S.snapIntraday && S.range === "5d" && S.interval === "5m" && S.clip && Date.now() - S.snapTime < 6 * 60 * 1000) {
      data = {};
      for (const p of picks) if (S.snapIntraday[p.sym]) data[p.sym] = S.snapIntraday[p.sym];
      const missing = picks.filter(p => !data[p.sym]).map(p => p.sym);
      if (missing.length) Object.assign(data, await apiMarket(missing, S.range, S.interval));
    } else {
      data = await apiMarket(picks.map(p => p.sym), S.range, S.interval);
    }
    S.charts = data;
    render(picks);
    if (S.view === "insights") renderInsights();
    setStatus("updated <b>" + new Date().toLocaleTimeString("en-IN", { hour12: false }) + "</b>" + (S.apiOk ? "" : " · proxy mode"));
  } catch (e) {
    console.error(e);
    if (!pool.size) showMsg("Could not load market data — check connection.", true);
    setStatus('<span style="color:var(--red)">update failed — will retry</span>');
  }
  busy = false;
}

/* ================= Rendering ================= */
function showMsg(t, err) { const m = document.getElementById("msg"); m.style.display = "block"; m.className = err ? "error" : ""; m.textContent = t; }
function setStatus(h) { document.getElementById("status").innerHTML = h; }
const fmt = x => x == null ? "–" : Number(x).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: x >= 1000 ? 0 : 2 });
const pc = x => x == null ? "–" : (x >= 0 ? "+" : "") + x.toFixed(2) + "%";
const cls = x => x == null ? "" : x >= 0 ? "up" : "down";

function fillLayout(n) {
  // Fill the whole viewport: pick the col count whose cells best use the area
  // (aspect closest to ~1.25), then stretch cells to consume every pixel.
  const wrap = document.getElementById("gridWrap");
  const gap = 8, w = wrap.clientWidth - 20, h = wrap.clientHeight - 20;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = (w - (c - 1) * gap) / c, ch = (h - (r - 1) * gap) / r;
    if (cw < 200 || ch < 180) continue;
    const score = Math.abs(Math.log((cw / ch) / 1.25));
    if (!best || score < best.score) best = { cols: c, cellW: Math.floor(cw), cellH: Math.floor(ch), score };
  }
  if (!best) { // very small screens: fixed-height cells, page scrolls
    const c = Math.max(1, Math.floor(w / 240));
    best = { cols: c, cellW: Math.floor((w - (c - 1) * gap) / c), cellH: 240 };
  }
  return best;
}

function seriesData(d) {
  const cd = [], vd = [];
  for (let i = 0; i < d.t.length; i++) {
    if (d.c[i] == null || d.o[i] == null) continue;
    const time = d.t[i] + IST_OFF;
    cd.push({ time, open: d.o[i], high: d.h[i] ?? Math.max(d.o[i], d.c[i]), low: d.l[i] ?? Math.min(d.o[i], d.c[i]), close: d.c[i] });
    vd.push({ time, value: d.v[i] || 0, color: d.c[i] >= d.o[i] ? "rgba(38,166,154,.4)" : "rgba(239,83,80,.4)" });
  }
  return { cd, vd };
}
function smaData(cd, p) {
  const out = []; let sum = 0;
  for (let i = 0; i < cd.length; i++) {
    sum += cd[i].close;
    if (i >= p) sum -= cd[i - p].close;
    if (i >= p - 1) out.push({ time: cd[i].time, value: sum / p });
  }
  return out;
}

function chartOpts(w, h) {
  return {
    width: w, height: h,
    layout: { background: { color: "transparent" }, textColor: "#7d8590", fontSize: 10 },
    grid: { vertLines: { color: "#1a1f28" }, horzLines: { color: "#1a1f28" } },
    rightPriceScale: { borderColor: "#262c36" },
    timeScale: { borderColor: "#262c36", timeVisible: S.interval !== "1d" && S.interval !== "1wk", secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Magnet },
    handleScroll: false, handleScale: false
  };
}

function buildChart(el, w, h) {
  const chart = LightweightCharts.createChart(el, chartOpts(w, h));
  const candles = chart.addCandlestickSeries({ upColor: "#26a69a", downColor: "#ef5350", borderUpColor: "#26a69a", borderDownColor: "#ef5350", wickUpColor: "#26a69a", wickDownColor: "#ef5350" });
  const vol = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  const s20 = chart.addLineSeries({ color: "#f5a623", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  const s50 = chart.addLineSeries({ color: "#2962ff", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  return { chart, candles, vol, s20, s50 };
}
function feedChart(cobj, d) {
  const { cd, vd } = seriesData(d);
  cobj.candles.setData(cd);
  cobj.vol.setData(S.showVol ? vd : []);
  cobj.s20.setData(S.showS20 ? smaData(cd, 20) : []);   // SMAs computed over full
  cobj.s50.setData(S.showS50 ? smaData(cd, 50) : []);   // lookback, shown clipped
  let from = 0;
  if (S.clip && cd.length) {
    const day = t => Math.floor(t / 86400);
    const lastDay = day(cd[cd.length - 1].time);
    from = cd.findIndex(x => day(x.time) === lastDay);
    if (from < 0) from = 0;
  }
  const prevClose = from > 0 ? cd[from - 1].close : d.meta.prevClose;
  if (prevClose != null) {
    if (!cobj._pl) cobj._pl = cobj.candles.createPriceLine({ price: prevClose, color: "#7d8590", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false });
    else cobj._pl.applyOptions({ price: prevClose });
  }
  if (S.clip && from > 0)
    cobj.chart.timeScale().setVisibleRange({ from: cd[from].time, to: cd[cd.length - 1].time });
  else cobj.chart.timeScale().fitContent();
}

function render(picks) {
  const grid = document.getElementById("grid");
  const msg = document.getElementById("msg");
  const avail = picks.filter(p => S.charts[p.sym] && S.charts[p.sym].t && S.charts[p.sym].t.length);
  msg.style.display = avail.length ? "none" : "block";
  const { cols, cellW, cellH } = fillLayout(Math.max(avail.length, 1));
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
  grid.style.gridAutoRows = `${cellH}px`;

  const want = new Set(avail.map(p => p.sym));
  for (const [sym, obj] of pool) if (!want.has(sym)) { obj.chart.remove(); obj.wrap.remove(); pool.delete(sym); }

  const chartH = cellH - 30;
  for (const p of avail) {
    const d = S.charts[p.sym];
    const chg = d.meta.prevClose && d.meta.last ? (d.meta.last - d.meta.prevClose) / d.meta.prevClose * 100 : p.d1;
    let obj = pool.get(p.sym);
    if (!obj) {
      const wrap = document.createElement("div");
      wrap.className = "card";
      wrap.innerHTML = `<div class="card-head"><span class="sym"></span><span class="px"></span><span class="chg"></span><button class="max" title="Expand">⤢</button></div><div class="chart-el"></div>`;
      grid.appendChild(wrap);
      obj = buildChart(wrap.querySelector(".chart-el"), cellW - 2, chartH);
      obj.wrap = wrap;
      wrap.querySelector(".max").onclick = () => openModal(p.sym);
      wrap.querySelector(".card-head").ondblclick = () => openModal(p.sym);
      pool.set(p.sym, obj);
    }
    grid.appendChild(obj.wrap); // keeps ranking order
    obj.wrap.querySelector(".sym").textContent = p.sym;
    obj.wrap.querySelector(".px").textContent = "₹" + fmt(d.meta.last);
    const ce = obj.wrap.querySelector(".chg");
    ce.textContent = (chg >= 0 ? "▲" : "▼") + Math.abs(chg ?? 0).toFixed(2) + "%";
    ce.className = "chg " + cls(chg);
    obj.chart.applyOptions(chartOpts(cellW - 2, chartH));
    feedChart(obj, d);
  }
  renderTable(want);
  renderStrip();
  if (S.modalSym && S.charts[S.modalSym]) feedModal();
}

function renderTable(liveSet) {
  const tb = document.getElementById("tbody");
  tb.innerHTML = S.rows.map(r => `
    <tr data-s="${r.sym}" class="${liveSet && liveSet.has(r.sym) ? "live" : ""}">
      <td>${r.sym}</td><td>${fmt(r.last)}</td>
      <td class="${cls(r.d1)}">${pc(r.d1)}</td><td class="${cls(r.w1)}">${pc(r.w1)}</td>
      <td class="${cls(r.m1)}">${pc(r.m1)}</td><td class="${cls(r.m3)}">${pc(r.m3)}</td>
      <td>${r.rsi == null ? "–" : r.rsi.toFixed(0)}</td>
    </tr>`).join("");
  tb.querySelectorAll("tr").forEach(tr => tr.onclick = () => openModal(tr.dataset.s));
}

function renderStrip() {
  const sorted = [...Object.values(S.metrics)].sort((a, b) => (b.d1 ?? 0) - (a.d1 ?? 0));
  const picks = sorted.slice(0, 10).concat(sorted.slice(-10).reverse());
  document.getElementById("strip").innerHTML = picks.map(r =>
    `<span class="chip" data-s="${r.sym}"><span class="sym">${r.sym}</span><span class="${cls(r.d1)}">${pc(r.d1)}</span></span>`).join("");
  document.querySelectorAll("#strip .chip").forEach(c => c.onclick = () => openModal(c.dataset.s));
}

/* ================= Insights view (Weekend Investing style breadth) ================= */
const SECTORS = {
  "Banks": ["HDFCBANK","ICICIBANK","SBIN","AXISBANK","KOTAKBANK","INDUSINDBK"],
  "NBFC / Finance": ["BAJFINANCE","BAJAJFINSV","JIOFIN","SHRIRAMFIN","LICI","SBILIFE","HDFCLIFE"],
  "IT": ["INFY","TCS","HCLTECH","WIPRO","TECHM"],
  "Auto": ["MARUTI","M&M","TATAMOTORS","EICHERMOT","HEROMOTOCO","BAJAJ-AUTO"],
  "Metals": ["TATASTEEL","JSWSTEEL","HINDALCO","VEDL"],
  "Oil & Gas": ["RELIANCE","ONGC","IOC","BPCL","GAIL","COALINDIA"],
  "Power": ["NTPC","POWERGRID"],
  "FMCG": ["ITC","HINDUNILVR","NESTLEIND","BRITANNIA","TATACONSUM"],
  "Consumer / Retail": ["TITAN","TRENT","DMART","ASIANPAINT","PIDILITIND"],
  "Pharma / Health": ["SUNPHARMA","DRREDDY","CIPLA","APOLLOHOSP"],
  "Infra / Cement": ["LT","ULTRACEMCO","GRASIM","AMBUJACEM","DLF","ADANIPORTS","ADANIENT"],
  "Defence": ["BEL","HAL"],
  "Telecom": ["BHARTIARTL"]
};
function heat(v) {
  if (v == null) return "transparent";
  const a = Math.min(Math.abs(v) / 12, 0.75) + 0.08;
  return v >= 0 ? `rgba(38,166,154,${a})` : `rgba(239,83,80,${a})`;
}
function renderInsights() {
  const ms = Object.values(S.metrics);
  const el = document.getElementById("insights");
  if (!ms.length) { el.innerHTML = '<div id="msg"><span class="spin"></span>Loading…</div>'; return; }
  const n = ms.length;
  const cnt = k => ms.filter(m => m[k] === true).length;
  const hasB = ms.some(m => m.a20 != null);
  const adv = ms.filter(m => (m.d1 ?? 0) > 0).length, dec = ms.filter(m => (m.d1 ?? 0) < 0).length;
  const bar = (lbl, c) => `<div class="bt"><span class="lbl">${lbl}</span><div class="track"><div class="fill" style="width:${(c / n * 100).toFixed(0)}%;background:${c / n >= .5 ? "var(--green)" : "var(--red)"}"></div></div><span class="val">${c}/${n} · ${(c / n * 100).toFixed(0)}%</span></div>`;

  const bins = [[-1e9,-10],[-10,-5],[-5,0],[0,5],[5,10],[10,1e9]], labels = ["<-10%","-10:-5","-5:0","0:+5","+5:+10",">+10%"];
  const bc = bins.map(([a, b]) => ms.filter(m => m.m1 != null && m.m1 > a && m.m1 <= b).length);
  const bmax = Math.max(...bc, 1);
  const hist = bc.map((c, i) => `<div class="hbin"><span>${c}</span><div class="bar" style="height:${Math.max(c / bmax * 84, 2).toFixed(0)}px;background:${i < 3 ? "var(--red)" : "var(--green)"};opacity:.85"></div><span>${labels[i]}</span></div>`).join("");

  const avg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
  const rows = Object.entries(SECTORS).map(([sec, list]) => {
    const mm = list.map(s => S.metrics[s]).filter(Boolean);
    if (!mm.length) return null;
    return { sec, cnt: mm.length, d1: avg(mm.map(m => m.d1)), w1: avg(mm.map(m => m.w1)), m1: avg(mm.map(m => m.m1)),
             m3: avg(mm.map(m => m.m3)), m6: avg(mm.map(m => m.m6)), y1: avg(mm.map(m => m.y1)) };
  }).filter(Boolean).sort((a, b) => (b.m1 ?? -99) - (a.m1 ?? -99));
  const cell = v => `<td style="background:${heat(v)}">${v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%"}</td>`;
  const rot = rows.map(r => `<tr><td>${r.sec} <span style="color:var(--muted);font-weight:400">(${r.cnt})</span></td>${cell(r.d1)}${cell(r.w1)}${cell(r.m1)}${cell(r.m3)}${cell(r.m6)}${cell(r.y1)}</tr>`).join("");

  const withHi = ms.filter(m => m.hi52 != null);
  const near = withHi.filter(m => m.hi52 >= -5).length;
  const top = [...withHi].sort((a, b) => b.hi52 - a.hi52).slice(0, 12);
  const hiRows = top.map(m => `<div><span>${m.sym}</span><span class="${m.hi52 >= -2 ? "up" : ""}">${m.hi52.toFixed(1)}%</span></div>`).join("");

  el.innerHTML = `<div class="ins-grid">
    <div class="ins-card"><h3>Market Breadth — trend health</h3>
      ${hasB ? bar("Above 20 DMA", cnt("a20")) + bar("Above 50 DMA", cnt("a50")) + bar("Above 200 DMA", cnt("a200"))
             : '<div style="color:var(--muted);font-size:11px;margin-bottom:8px">DMA breadth appears after the next data refresh.</div>'}
      <div style="margin-top:12px" class="bt"><span class="lbl">Adv / Decline</span><div class="adbar" style="flex:1"><div style="background:var(--green);width:${(adv / (adv + dec || 1) * 100).toFixed(0)}%;display:flex;align-items:center;padding-left:6px">${adv}</div><div style="background:var(--red);flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:6px">${dec}</div></div><span class="val"></span></div>
    </div>
    <div class="ins-card"><h3>1-Month Return Distribution</h3><div class="hist">${hist}</div>
      <div style="margin-top:10px;font-size:11px;color:var(--muted)"><b style="color:var(--text)">${near}</b> of ${withHi.length} stocks within 5% of their 52-week high</div>
    </div>
    <div class="ins-card wide"><h3>Sector Rotation — average returns, ranked by 1M</h3>
      <table class="rot"><thead><tr><th>Sector</th><th>1D</th><th>1W</th><th>1M</th><th>3M</th><th>6M</th><th>1Y</th></tr></thead><tbody>${rot}</tbody></table>
    </div>
    <div class="ins-card wide"><h3>Distance from 52-Week High — momentum leaders</h3><div class="hilist">${hiRows}</div></div>
  </div>`;
}

/* ================= Fullscreen modal ================= */
async function openModal(sym) {
  S.modalSym = sym;
  document.getElementById("modal").classList.add("open");
  document.getElementById("mSym").textContent = sym;
  const met = S.metrics[sym];
  document.getElementById("mName").textContent = met ? met.name : "";
  if (!S.charts[sym]) {
    const d = await apiMarket([sym], S.range, S.interval);
    Object.assign(S.charts, d);
  }
  feedModal();
}
function feedModal() {
  const sym = S.modalSym, d = S.charts[sym];
  if (!d) return;
  const el = document.getElementById("modalChart");
  const w = el.clientWidth || el.parentElement.clientWidth, h = el.clientHeight || 400;
  if (!modalChart) {
    modalChart = buildChart(el, w, h);
    modalChart.chart.applyOptions({ handleScroll: true, handleScale: true });
    modalChart.chart.subscribeCrosshairMove(pt => {
      const leg = document.getElementById("modalLegend");
      if (!pt || !pt.time || !pt.seriesData) { leg.textContent = ""; return; }
      const c = pt.seriesData.get(modalChart.candles);
      if (c) leg.textContent = `O ${fmt(c.open)}  H ${fmt(c.high)}  L ${fmt(c.low)}  C ${fmt(c.close)}`;
    });
  }
  modalChart.chart.applyOptions({ width: w, height: h, handleScroll: true, handleScale: true });
  feedChart(modalChart, d);
  const chg = d.meta.prevClose && d.meta.last ? (d.meta.last - d.meta.prevClose) / d.meta.prevClose * 100 : null;
  const mc = document.getElementById("mChg");
  mc.textContent = `₹${fmt(d.meta.last)}  ${pc(chg)}`;
  mc.className = "chg " + cls(chg);
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
  S.modalSym = null;
  if (modalChart) { modalChart.chart.remove(); modalChart = null; document.getElementById("modalChart").innerHTML = ""; }
}

/* ================= Market status ================= */
function marketStatus() {
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
  const day = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
  const open = day >= 1 && day <= 5 && mins >= 555 && mins <= 930;
  const b = document.getElementById("mktBadge");
  b.textContent = open ? "● NSE OPEN" : "NSE CLOSED";
  b.className = "badge" + (open ? " open" : "");
}

/* ================= Wiring ================= */
function schedule() { clearInterval(S.timer); S.timer = setInterval(() => { if (!document.hidden) refresh(); }, S.refreshSec * 1000); }
let rT;
function init() {
  const countSel = document.getElementById("count");
  for (let i = 1; i <= MAX_CHARTS; i++) countSel.add(new Option(i, i));
  countSel.value = S.count;

  document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#viewSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    S.view = b.dataset.v;
    document.getElementById("gridWrap").style.display = S.view === "charts" ? "block" : "none";
    document.getElementById("insights").style.display = S.view === "insights" ? "block" : "none";
    if (S.view === "insights") renderInsights(); else render(chartPicks(S.rows));
  });
  document.getElementById("mode").onchange = e => {
    S.mode = e.target.value;
    document.getElementById("watchlistBox").style.display = S.mode === "watchlist" ? "flex" : "none";
    S.metricsTime = 0; refresh(true);
  };
  countSel.onchange = e => { S.count = +e.target.value; refresh(); };
  document.querySelectorAll("#tf button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tf button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const parts = b.dataset.v.split("|");
    S.range = parts[0]; S.interval = parts[1]; S.clip = !!parts[2];
    S.charts = {}; refresh();
  });
  for (const [id, key] of [["tglVol", "showVol"], ["tglS20", "showS20"], ["tglS50", "showS50"]]) {
    document.getElementById(id).onclick = e => {
      S[key] = !S[key];
      e.target.classList.toggle("on", S[key]);
      render(chartPicks(S.rows));
    };
  }
  document.getElementById("interval").onchange = e => { S.refreshSec = +e.target.value; schedule(); };
  document.getElementById("watchlistInput").onchange = e => {
    S.watchlist = e.target.value.split(/[,\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
    try { localStorage.setItem("mp_watchlist", S.watchlist.join(",")) } catch (_) {}
    S.metricsTime = 0; refresh(true);
  };
  document.getElementById("thRow").querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (S.sortKey === k) S.sortDir *= -1; else { S.sortKey = k; S.sortDir = k === "sym" ? 1 : -1; }
    document.querySelectorAll("#thRow th").forEach(x => x.classList.toggle("sorted", x === th));
    S.rows = rankedRows(); renderTable(new Set([...pool.keys()]));
  });
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  try {   // instant paint from cached metrics while fresh data loads
    const snap = JSON.parse(localStorage.getItem("mp_metrics") || "null");
    if (snap && snap.m) { S.metrics = snap.m; S.rows = rankedRows(); renderTable(); renderStrip(); }
    const saved = localStorage.getItem("mp_watchlist");
    if (saved) { S.watchlist = saved.split(","); document.getElementById("watchlistInput").value = saved.replace(/,/g, ", "); }
  } catch (_) {}

  window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => render(chartPicks(S.rows)), 200); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  marketStatus(); setInterval(marketStatus, 30000);
  refresh(); schedule();
}
init();
</script>
