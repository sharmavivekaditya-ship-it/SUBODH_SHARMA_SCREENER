<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse Pro — NSE Trading Screen</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0b0e13; --panel: #12161d; --panel2: #171c24; --border: #262c36;
    --text: #dde3ea; --muted: #7d8590; --green: #26a69a; --red: #ef5350;
    --accent: #2962ff; --hl: #1c2230;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

  /* ===== Top toolbar ===== */
  #bar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; z-index: 20; }
  #bar h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
  #bar h1 span { color: var(--accent); }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 9px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.open { color: var(--green); border-color: var(--green); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 4px 9px; font-size: 11px; cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .ctl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  select, input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px; font-size: 11px; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  .tgl { font-size: 10px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
  .tgl.on { color: var(--accent); border-color: var(--accent); }
  #watchlistBox { display: none; } #watchlistInput { width: 260px; }
  #status { font-size: 10px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  #status b { color: var(--text); font-weight: 500; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 5px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ===== Ticker strip ===== */
  #strip { display: flex; gap: 6px; overflow-x: auto; padding: 5px 12px; background: var(--panel); border-bottom: 1px solid var(--border); scrollbar-width: none; flex: none; }
  #strip::-webkit-scrollbar { display: none; }
  .chip { display: flex; gap: 5px; align-items: baseline; font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 5px; white-space: nowrap; cursor: pointer; }
  .chip:hover { background: var(--hl); }
  .chip .sym { font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }

  /* ===== Main: sidebar + chart grid ===== */
  #main { flex: 1; display: flex; min-height: 0; }
  #side { width: 405px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #side h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 8px 12px 4px; }
  #tblWrap { flex: 1; overflow-y: auto; scrollbar-width: thin; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  thead th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-size: 9.5px; text-transform: uppercase; padding: 5px 6px; text-align: right; cursor: pointer; user-select: none; white-space: nowrap; z-index: 5; }
  thead th:first-child { text-align: left; padding-left: 12px; }
  thead th.sorted { color: var(--accent); }
  tbody td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #161b22; }
  tbody td:first-child { text-align: left; padding-left: 12px; font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hl); }
  tbody tr.live td:first-child { border-left: 2px solid var(--accent); padding-left: 10px; }
  .tag { font-style: normal; font-size: 8.5px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 3px; letter-spacing: .3px; }
  .tag.vcp { background: #2962ff33; color: #6ea3ff; }
  .tag.htf { background: #9b59b633; color: #c39bd3; }
  .tag.pb  { background: #e67e2233; color: #f0b27a; }
  .ctags .tag { font-size: 9px; }

  #gridWrap { flex: 1; overflow: auto; padding: 10px; }
  #grid { display: grid; gap: 8px; justify-content: center; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  .card-head { display: flex; align-items: baseline; gap: 6px; padding: 5px 9px 2px; flex: none; }
  .card-head .sym { font-weight: 700; font-size: 12px; }
  .card-head .px { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
  .card-head .chg { font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-head .max { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
  .card-head .max:hover { color: var(--text); }
  .chart-el { flex: 1; min-height: 0; }
  #msg { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }
  #msg.error { color: var(--red); }

  /* ===== Fullscreen modal ===== */
  #modal { display: none; position: fixed; inset: 0; background: rgba(4,6,10,.88); z-index: 50; padding: 3vh 3vw; }
  #modal.open { display: flex; flex-direction: column; }
  #modalCard { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #modalHead { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  #modalHead .sym { font-size: 17px; font-weight: 700; }
  #modalHead .name { font-size: 11px; color: var(--muted); }
  #modalLegend { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  #modalClose { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
  #modalClose:hover { color: var(--text); }
  #modalChart { flex: 1; min-height: 0; }

  /* ===== Insights view ===== */
  #insights, #portfolio { flex: 1; overflow: auto; padding: 12px; display: none; -webkit-overflow-scrolling: touch; }
  /* ---- filter bar ---- */
  .filterbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; }
  .fb { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
        padding: 7px 13px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
        transition: background .12s, color .12s, border-color .12s; min-height: 34px; }
  .fb:hover { color: var(--text); border-color: var(--muted); }
  .fb.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fb .sub { display: block; font-size: 9px; font-weight: 400; opacity: .8; margin-top: 1px; }
  .tblscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .rot th.active, .rot td.active { background: rgba(41,98,255,.10); }
  .rot th.active { color: var(--accent); }
  .idxbadge { font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
  .idxbadge.ok { background: #26a69a22; color: var(--green); border: 1px solid var(--green); }
  .idxbadge.no { background: #ef535022; color: var(--red); border: 1px solid var(--red); }
  #avInput { width: 130px; text-align: right; }
  .qy { color: var(--green); } .qn { color: var(--red); }
  .ins-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 1250px; margin: 0 auto; }
  .ins-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .ins-card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .ins-card.wide { grid-column: 1 / -1; }
  .bt { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 11px; }
  .bt .lbl { width: 110px; color: var(--muted); flex: none; }
  .bt .track { flex: 1; height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bt .fill { height: 100%; }
  .bt .val { width: 84px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .adbar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; font-size: 10px; color: #fff; }
  .hist { display: flex; align-items: flex-end; gap: 6px; height: 116px; margin-top: 8px; }
  .hbin { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font-size: 9px; color: var(--muted); gap: 3px; }
  .hbin .bar { width: 100%; border-radius: 3px 3px 0 0; }
  table.rot { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .rot th { font-size: 9.5px; color: var(--muted); text-transform: uppercase; padding: 4px 6px; text-align: right; }
  .rot th:first-child { text-align: left; }
  .rot td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #161b22; }
  .rot td:first-child { text-align: left; font-weight: 600; }
  .hilist { font-size: 11px; column-count: 2; column-gap: 30px; }
  .hilist div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #161b22; break-inside: avoid; }
  @media (max-width: 900px) { #side { display: none; } body { overflow: auto; } .ins-grid { grid-template-columns: 1fr; } .hilist { column-count: 1; } }

  /* ================= mobile ================= */
  @media (max-width: 700px) {
    body { overflow: auto; }
    #bar { padding: 8px 10px; gap: 8px; position: sticky; top: 0; }
    #bar h1 { font-size: 14px; }
    #bar .ctl, #bar .seg button, #bar select { font-size: 12px; }
    #bar .seg button { padding: 7px 11px; min-height: 34px; }   /* touch targets */
    .tgl { padding: 6px 10px; min-height: 32px; }
    #strip { padding: 6px 10px; }
    #insights, #portfolio { padding: 8px; }
    .ins-card { padding: 10px; border-radius: 10px; }
    .ins-card h3 { font-size: 12px; }
    .fb { flex: 1 1 auto; text-align: center; padding: 9px 10px; min-height: 40px; }
    /* tables scroll sideways instead of squeezing */
    .rot { font-size: 11px; min-width: 560px; }
    .rot th, .rot td { padding: 6px 5px; }
    /* drop the least essential columns so the key ones fit */
    .rot .m-hide { display: none; }
    #gridWrap { padding: 6px; }
    #modal { padding: 0; }
    #modalCard { border-radius: 0; }
  }
  @media (max-width: 420px) {
    .rot { min-width: 460px; }
    .fb { font-size: 11px; padding: 8px 8px; }
  }
</style>
</head>
<body>

<div id="bar">
  <h1>MARKET<span>PULSE</span></h1>
  <span class="badge" id="mktBadge">…</span>
  <div class="seg" id="viewSeg">
    <button data-v="charts" class="on">CHARTS</button><button data-v="insights">INSIGHTS</button><button data-v="portfolio">PORTFOLIO</button>
  </div>
  <div class="seg" id="basketSeg">
    <button data-b="fno" class="on">F&amp;O</button><button data-b="mtf">MTF 1:3</button>
  </div>
  <label class="ctl">Charts <select id="count"></select></label>
  <div class="seg" id="tf">
    <button data-v="5d|5m|1" class="on">1D</button><button data-v="5d|15m">5D</button><button data-v="1mo|1h">1M</button><button data-v="3mo|1d">3M</button><button data-v="6mo|1d">6M</button><button data-v="1y|1wk">1Y</button>
  </div>
  <button class="tgl on" id="tglVol">VOL</button>
  <button class="tgl" id="tglS20">SMA20</button>
  <button class="tgl" id="tglS50">SMA50</button>
  <label class="ctl">⟳ <select id="interval">
    <option value="30">30s</option><option value="60" selected>60s</option><option value="120">2m</option><option value="300">5m</option>
  </select></label>
  <button class="tgl" id="btnReport" title="Generate printable weekly report">REPORT</button>

<div id="strip"></div>

<div id="main">
  <div id="side">
    <h2 id="sideTitle">Momentum Ranking</h2>
    <div id="tblWrap">
      <table>
        <thead><tr id="thRow">
          <th>#</th><th>Symbol</th><th>Momo</th><th>RS</th><th>LTP</th><th>ATR%</th><th id="thQty">Lots</th><th>Status</th>
        </tr></thead>

  <div id="gridWrap">
    <div id="msg"><span class="spin"></span>Loading market data…</div>

  <div id="insights"></div>

</div>

<div id="modal">
  <div id="modalCard">
    <div id="modalHead">
      <span class="sym" id="mSym"></span><span class="name" id="mName"></span>
      <span class="chg" id="mChg"></span>

      <button id="modalClose">✕</button>

</div>

<script>
"use strict";
/* ================= Universe: Nifty 50 + liquid F&O (NSE) — edit freely ================= */
/* Universe is served by /api/universe (single source of truth: api/_universe.js).
   This inline list is only a fallback for pure-static hosting. */
let UNIVERSE = [
  "RELIANCE","HDFCBANK","ICICIBANK","INFY","TCS","BHARTIARTL","SBIN","AXISBANK",
  "KOTAKBANK","ITC","LT","HINDUNILVR","BAJFINANCE","MARUTI","M&M","SUNPHARMA",
  "NTPC","POWERGRID","TITAN","ULTRACEMCO","TATAMOTORS","TATASTEEL","JSWSTEEL",
  "ASIANPAINT","NESTLEIND","ADANIENT","ADANIPORTS","ONGC","COALINDIA","BAJAJFINSV",
  "HCLTECH","WIPRO","TECHM","GRASIM","DRREDDY","CIPLA","APOLLOHOSP","EICHERMOT",
  "HEROMOTOCO","BAJAJ-AUTO","BRITANNIA","TATACONSUM","HINDALCO","INDUSINDBK",
  "SBILIFE","HDFCLIFE","SHRIRAMFIN","TRENT","BEL","HAL","DLF","VEDL","JIOFIN",
  "PIDILITIND","AMBUJACEM","GAIL","IOC","BPCL","LICI","DMART"
];
async function loadUniverse() {
  S.lists = { fno: UNIVERSE.slice(), mtf: [] };   // fallback if /api/universe is absent
  try {
    const r = await fetch("/api/universe", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j.universe && j.universe.length > 50) {
      UNIVERSE = j.universe;
      S.lists = { fno: j.fno || [], mtf: j.mtf3 || [] };
      S.lots = j.lots || {};
      S.mtfLev = j.mtfLev || {};
      S.minMtfLev = j.minMtfLev || 3;
      S.mtfLevDefault = j.mtfLevDefault || 4;
      S.mtfLevExact = (j.mtfLevCustom || 0) > 0;
      if (j.sectors) setSectors(j.sectors, "bundled");
    }
  } catch (_) {}
  // Official NSE sectoral indices — authoritative membership, overrides the bundle
  try {
    const r = await fetch("/api/nse-sectors", { cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      if (j.sectors && Object.keys(j.sectors).length >= 10) {
        setSectors(j.sectors, j.source || "NSE");
        S.sectorSrc = j.source;
        S.coverage = j.coverage || null;
        // every index constituent must be priced, or sectors are computed on partial data
        if (Array.isArray(j.universe) && j.universe.length) {
          UNIVERSE = [...new Set([...UNIVERSE, ...j.universe])];
        }
      }
    }
  } catch (_) {}
}
const MAX_CHARTS = 12, METRICS_TTL = 4 * 60 * 1000, IST_OFF = 19800;
const MAX_POSITIONS = 15;   // funds are deployed into the top 15 names only
// Relative strength: recency-weighted blend of 1M / 3M / 6M growth, then
// percentile-ranked 1-99 across the whole universe (so it is genuinely *relative*).
const RS_W = { m1: 0.5, m3: 0.3, m6: 0.2 };

function rsRawOf(m) {
  let s = 0, w = 0;
  for (const k of ["m1", "m3", "m6"]) if (m[k] != null) { s += m[k] * RS_W[k]; w += RS_W[k]; }
  return w > 0 ? s / w : null;                 // renormalised if a window is missing
}
/* RS is a percentile against a FIXED reference distribution of the whole
   universe, held in RS_BASIS. Re-percentiling on every change looked correct but
   made RS drift as you browsed: clicking an index that added 250 unpriced
   constituents moved existing stocks by up to 17 points, so the same stock
   showed different RS depending on where you had clicked. The basis is now built
   once per data refresh; stocks added later are scored INTO it and move nobody. */
let RS_BASIS = [];
function buildRsBasis(metrics) {
  RS_BASIS = Object.values(metrics).map(m => m.rsRaw).filter(x => x != null).sort((a, b) => a - b);
  return RS_BASIS.length;
}
function rsFromBasis(v) {
  const n = RS_BASIS.length;
  if (v == null || n < 2) return v == null ? null : 50;
  let lo = 0, hi = n;                       // first index with RS_BASIS[i] >= v
  while (lo < hi) { const mid = (lo + hi) >> 1; if (RS_BASIS[mid] < v) lo = mid + 1; else hi = mid; }
  return Math.round(lo / (n - 1) * 98) + 1;
}
/* Rebuild the basis from `metrics` and score everything against it. */
function assignRS(metrics) {
  buildRsBasis(metrics);
  for (const m of Object.values(metrics)) m.rs = rsFromBasis(m.rsRaw);
}
/* Score newcomers against the existing basis without disturbing anyone. */
function scoreIntoBasis(newMetrics) {
  for (const m of Object.values(newMetrics)) m.rs = rsFromBasis(m.rsRaw);
}
// Annualised volatility of daily returns (path smoothness) over `p` sessions.
function volOf(cl, p = 63) {
  if (cl.length < p + 1) return null;
  const r = [];
  for (let i = cl.length - p; i < cl.length; i++) r.push(Math.log(cl[i] / cl[i - 1]));
  const mu = r.reduce((a, b) => a + b, 0) / r.length;
  const sd = Math.sqrt(r.reduce((a, b) => a + (b - mu) ** 2, 0) / (r.length - 1));
  return sd * Math.sqrt(252) * 100;
}
/* VaRS — the RS rating (1-99), adjusted for volatility.
   RS is already a percentile, so it is always positive and direction is baked in
   (weak stocks sit at 1-20). A plain volatility divide is therefore safe and
   monotonic — no sign handling needed.
        VaRS = RS x (REF_VOL / vol)
   REF_VOL is the neutral anchor: a stock at REF_VOL volatility keeps its RS
   unchanged, calmer stocks score above it, choppier ones below.

   REMOVED — VaRS / AtVaRS / AtMVaRS. Tested against live data and dropped:
     • AtVaRS correlated 0.935 with plain RS. Dividing by volatility then
       multiplying by ATR% cancels out (vol vs ATR% correlate 0.634), so all the
       machinery landed back on RS.
     • The divide is structurally wrong for "find the strongest": a FLAT stock
       wins by having a small denominator. SUNPHARMA (RS 49, vol 13%) outranked
       LAURUSLABS (RS 98, vol 29%) in pharma.
     • AtMVaRS multiplied by broker leverage, which spans only 3.00-3.77x and is
       a position-SIZING input, not a measure of stock quality.

   Clenow's `momo` (annualised 90d regression slope x R2) already does the job
   correctly: R2 MULTIPLIES the slope, so a flat stock scores ~0 however smooth
   it is, whereas dividing by volatility REWARDS flatness. Same intent, opposite
   behaviour. momo correlates only 0.653 with RS, so it adds real information.
   Ranked by momo, pharma reads LAURUSLABS 289 > DIVISLAB 100 > ... > SUNPHARMA 14.

   ATR% and MTF leverage are kept as COLUMNS (tradability / sizing) and as an
   optional ATR% floor — never multiplied into the quality score. */
let REF_VOL = 30;                    // universe median volatility, reference only
function setRefVol(metrics) {
  const v = Object.values(metrics).map(m => m.vol).filter(x => x > 0).sort((a, b) => a - b);
  if (v.length > 20) REF_VOL = v[Math.floor(v.length / 2)];
  return REF_VOL;
}

const S = {
  count: 6, range: "5d", interval: "5m", clip: true, refreshSec: 60, timer: null,
  basket: "fno", lists: { fno: [], mtf: [] }, acct: { fno: 1000000, mtf: 1000000 },
  lots: {}, marginPct: 20,
  nseIdx: null, nseBusy: false, nseErr: null, selIdx: null, selSyms: null, selErr: null,
  idxView: "hits", sectorSrc: null, coverage: null,
  mtfLev: {}, minMtfLev: 3, mtfLevDefault: 4, mtfLevExact: false,
  metrics: {}, metricsTime: 0, charts: {}, rows: [],
  showVol: true, showS20: false, showS50: false,
  apiOk: null, modalSym: null, snapIntraday: null, snapTime: 0, view: "charts",
  indexInfo: null, idxBusy: false
};
const BASKET_LABEL = { fno: "F&O", mtf: "MTF 1:3" };
const pool = new Map();   // sym -> {chart, series...} reused across refreshes
let modalChart = null;

/* ================= Data layer: one combined call, edge-cached ================= */
async function apiMarket(symbols, range, interval) {
  if (S.apiOk !== false) {
    try {
      const groups = [];
      for (let i = 0; i < symbols.length; i += 100) groups.push(symbols.slice(i, i + 100));
      const parts = await Promise.all(groups.map(async g => {
        const r = await fetch(`/api/market?symbols=${g.map(encodeURIComponent).join(",")}&range=${range}&interval=${interval}`, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return (await r.json()).data;
      }));
      S.apiOk = true;
      return Object.assign({}, ...parts);
    } catch (_) {}
    if (S.apiOk === null) S.apiOk = false;
  }
  // Static-hosting fallback: per-symbol via public CORS proxy (slower)
  const out = {};
  const chunk = 8;
  for (let i = 0; i < symbols.length; i += chunk) {
    await Promise.all(symbols.slice(i, i + chunk).map(async s => {
      const sym = s.startsWith("^") || s.includes(".") ? s : s + ".NS";
      const y = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=${range}&interval=${interval}&includePrePost=false`;
      try {
        const r = await fetch("https://corsproxy.io/?url=" + encodeURIComponent(y));
        const j = await r.json();
        const c = j.chart && j.chart.result && j.chart.result[0];
        if (!c || !c.timestamp) return;
        const q = (c.indicators && c.indicators.quote && c.indicators.quote[0]) || {};
        out[s] = { t: c.timestamp, o: q.open || [], h: q.high || [], l: q.low || [], c: q.close || [], v: q.volume || [],
          meta: { prevClose: c.meta.chartPreviousClose ?? c.meta.previousClose, last: c.meta.regularMarketPrice,
                  name: c.meta.shortName || sym, high: c.meta.regularMarketDayHigh, low: c.meta.regularMarketDayLow } };
      } catch (_) {}
    }));
  }
  return out;
}

/* ================= Metrics (screener table): 1y daily data → returns + RSI ================= */
function rsi14(cl) {
  const p = 14;
  if (cl.length < p + 1) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = cl[i] - cl[i - 1]; if (d > 0) g += d; else l -= d; }
  g /= p; l /= p;
  for (let i = p + 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1];
    g = (g * (p - 1) + Math.max(d, 0)) / p;
    l = (l * (p - 1) + Math.max(-d, 0)) / p;
  }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
const pctBack = (cl, n) => cl.length > n ? (cl[cl.length - 1] - cl[cl.length - 1 - n]) / cl[cl.length - 1 - n] * 100 : null;

/* Setup candidates (heuristic): VCP, High Tight Flag, Pullback + ADR% & avg turnover */
function setupExtras(cl, hi, lo, vo) {
  const n = cl.length;
  const out = { vcp: false, htf: false, pb: false, adr: null, tov: null, setupScore: 0 };
  if (n < 25) return out;
  const last = cl[n - 1];
  const sma = (a, p) => a.length >= p ? a.slice(-p).reduce((x, y) => x + y, 0) / p : null;
  let s = 0, t = 0;
  for (let i = n - 20; i < n; i++) { s += (hi[i] - lo[i]) / cl[i]; t += vo[i] * cl[i]; }
  out.adr = s / 20 * 100;
  out.tov = t / 20 / 1e7;              // avg daily turnover, ₹ crore
  if (n < 60) return out;
  const s20 = sma(cl, 20), s50 = sma(cl, 50), s200 = n >= 200 ? sma(cl, 200) : null;
  const off52 = (last / Math.max(...cl) - 1) * 100;
  const trp = (a, b) => { let x = 0, c = 0; for (let i = n - a; i < n - b; i++) { x += (hi[i] - lo[i]) / cl[i]; c++; } return x / c * 100; };
  const atrR = trp(10, 0), atrP = trp(30, 10);
  const cl10 = cl.slice(-10);
  const range10 = (Math.max(...cl10) - Math.min(...cl10)) / last * 100;
  const v10 = sma(vo, 10), v50 = sma(vo, 50);
  // VCP: uptrend near highs, volatility contracting, volume drying up, tight range
  out.vcp = !!(s200 != null && last > s50 && s50 > s200 && off52 >= -20 &&
               atrR < atrP * 0.75 && v10 < v50 && range10 < 9);
  // HTF: ≥40% run-up in ~2 months, then tight flag near highs
  const base = cl.slice(-50, -10);
  const runGain = base.length ? (Math.max(...cl.slice(-15)) - Math.min(...base)) / Math.min(...base) * 100 : 0;
  out.htf = !!(runGain >= 40 && off52 >= -15 && range10 < 12);
  // Pullback: uptrend retracing 3-12% onto 20/50 DMA with cooled RSI
  const dd = (last / Math.max(...cl.slice(-20)) - 1) * 100;
  const nearMA = (s20 && Math.abs(last - s20) / s20 < 0.03) || (s50 && Math.abs(last - s50) / s50 < 0.035);
  const r = rsi14(cl);
  out.pb = !!(s200 != null && last > s200 && s50 > s200 && dd <= -3 && dd >= -12 && nearMA && r >= 35 && r <= 60);
  out.setupScore = (out.vcp ? 4 : 0) + (out.htf ? 2 : 0) + (out.pb ? 1 : 0);
  return out;
}
/* Clenow momentum: annualized 90d exp regression slope × R², ATR20, gap & trend disqualifiers */
function momoExtras(cl, hi, lo, op) {
  const n = cl.length;
  const out = { momo: null, atr20: null, above100: null, gap90: null, qual: false };
  if (n < 40) return out;
  const win = cl.slice(-90), m = win.length;
  const ys = win.map(Math.log);
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < m; i++) { sx += i; sy += ys[i]; sxx += i * i; sxy += i * ys[i]; }
  const slope = (m * sxy - sx * sy) / (m * sxx - sx * sx);
  const icpt = (sy - slope * sx) / m, ym = sy / m;
  let ssr = 0, sst = 0;
  for (let i = 0; i < m; i++) { const f = icpt + slope * i; ssr += (ys[i] - f) ** 2; sst += (ys[i] - ym) ** 2; }
  const r2 = sst > 0 ? Math.max(0, 1 - ssr / sst) : 0;
  out.momo = (Math.exp(slope * 250) - 1) * 100 * r2;
  let atr = 0;
  for (let i = n - 20; i < n; i++)
    atr += Math.max(hi[i] - lo[i], Math.abs(hi[i] - cl[i - 1]), Math.abs(lo[i] - cl[i - 1]));
  out.atr20 = atr / 20;
  let g = 0;
  for (let i = Math.max(1, n - 90); i < n; i++) {
    const gap = Math.abs((op[i] || cl[i]) / cl[i - 1] - 1) * 100;
    if (gap > g) g = gap;
  }
  out.gap90 = g;
  const s100 = n >= 100 ? cl.slice(-100).reduce((a, b) => a + b, 0) / 100 : null;
  out.above100 = s100 != null ? cl[n - 1] > s100 : null;
  out.qual = !!(out.above100 && g <= 15);
  return out;
}
const tagsHtml = (m, dash) =>
  ((m.vcp ? '<i class="tag vcp">VCP</i>' : "") + (m.htf ? '<i class="tag htf">HTF</i>' : "") + (m.pb ? '<i class="tag pb">PB</i>' : "")) || (dash ? "–" : "");

async function loadMetrics(force) {
  const symbols = UNIVERSE;
  if (!force && Object.keys(S.metrics).length && Date.now() - S.metricsTime < METRICS_TTL) return;
  const data = await apiMarket(symbols, "1y", "1d");
  const m = {};
  for (const [sym, d] of Object.entries(data)) {
    const cl = [], hh = [], ll = [], vv = [], oo = [];
    for (let i = 0; i < d.c.length; i++) if (d.c[i] != null) {
      cl.push(d.c[i]); hh.push(d.h[i] ?? d.c[i]); ll.push(d.l[i] ?? d.c[i]); vv.push(d.v[i] || 0); oo.push(d.o[i] ?? d.c[i]);
    }
    if (cl.length < 2) continue;
    const last = d.meta.last ?? cl[cl.length - 1];
    const prev = cl[cl.length - 2]; // yesterday's close (meta.prevClose on a 1y range = a year ago!)
    const smaN = n => cl.length >= n ? cl.slice(-n).reduce((a, b) => a + b, 0) / n : null;
    const s20v = smaN(20), s50v = smaN(50), s200v = smaN(200);
    m[sym] = {
      sym, last, name: d.meta.name,
      d1: prev ? (last - prev) / prev * 100 : null,
      w1: pctBack(cl, 5), m1: pctBack(cl, 21), m3: pctBack(cl, 63), m6: pctBack(cl, 126), y1: pctBack(cl, 251),
      rsi: rsi14(cl),
      a20: s20v != null ? last > s20v : null, a50: s50v != null ? last > s50v : null, a200: s200v != null ? last > s200v : null,
      hi52: (last / Math.max(...cl) - 1) * 100,
      ...setupExtras(cl, hh, ll, vv),
      ...momoExtras(cl, hh, ll, oo)
    };
    m[sym].rsRaw = rsRawOf(m[sym]);
    m[sym].vol = volOf(cl);
  }
  if (!Object.keys(m).length) throw new Error("metrics failed");
  assignRS(m);
  setRefVol(m);
  for (const k of Object.keys(m)) {
    const x = m[k];
    x.atrPct = x.atr20 && x.last ? x.atr20 / x.last * 100 : null;
  }
  S.metrics = m; S.metricsTime = Date.now();
  try { localStorage.setItem("mp_metrics", JSON.stringify({ m, t: Date.now() })) } catch (_) {}
}

/* Momentum ranking + target portfolio, computed per basket (F&O and MTF are
   ranked and sized independently — same rules, separate capital). */
function computePortfolio(basket) {
  const b = basket || S.basket;
  const member = new Set(S.lists[b] && S.lists[b].length ? S.lists[b] : UNIVERSE);
  const ms = Object.values(S.metrics).filter(m => m.momo != null && m.last && member.has(m.sym));
  const ranked = [...ms].sort((a, b2) => b2.momo - a.momo);
  const topN = Math.ceil(ranked.length * 0.2);   // book: only hold the top 20% of the ranking
  const av = S.acct[b];                          // your own money
  const isFno = b === "fno";
  // Buying power = the exposure your capital can actually carry.
  //   F&O : capital is margin, so notional capacity = capital / margin%
  //   MTF : capital × leverage
  // Positions are risk-sized against buying power (10 bps of exposure per position),
  // so the leverage actually gets used instead of sitting idle.
  const lev = s => S.mtfLev[s] || S.mtfLevDefault;
  // For MTF each stock carries its own max leverage, so the shared risk base is
  // capital × the best leverage available in the basket; own funds stay the cap.
  const maxLev = isFno ? 0 : Math.max(...(S.lists.mtf.length ? S.lists.mtf.map(lev) : [S.mtfLevDefault]));
  const budget = isFno ? av / (S.marginPct / 100) : av * maxLev;
  // 1) pick the top MAX_POSITIONS qualifying names from the eligible slice
  const picks = [];
  let skipped = 0;
  for (const m of ranked.slice(0, topN)) {
    if (picks.length >= MAX_POSITIONS) break;
    if (!m.qual || !m.atr20) continue;
    const riskShares = budget * 0.001 / m.atr20;              // BuyingPower × 0.001 / ATR20
    if (riskShares < 1) continue;
    if (isFno) {
      const lot = S.lots[m.sym];
      if (!lot) continue;                                      // no lot size → not tradable as futures
      if (Math.round(riskShares / lot) < 1) { skipped++; continue; }  // 1 lot > risk unit
      picks.push({ m, riskShares, lot });
    } else {
      picks.push({ m, riskShares, lv: lev(m.sym) });
    }
  }

  // 2) scale the risk weights so the capital is fully deployed across those names
  const rawCost = picks.reduce((s, p) =>
    s + (isFno ? p.riskShares * p.m.last : p.riskShares * p.m.last / p.lv), 0);
  const cap = isFno ? budget : av;                             // F&O: notional capacity, MTF: own funds
  const scale = rawCost > 0 ? Math.max(1, cap / rawCost) : 1;

  let free = budget, ownFree = av;
  const holdings = [];
  let notional = 0, margin = 0;

  for (const p of picks) {
    const m = p.m;
    let h;
    if (isFno) {
      const lots = Math.max(1, Math.round(p.riskShares * scale / p.lot));
      const qty = lots * p.lot;
      const notl = qty * m.last;
      const marg = notl * S.marginPct / 100;
      if (notl > free) continue;
      h = { ...m, lot: p.lot, lots, shares: qty, notional: notl, margin: marg, cost: marg, wt: notl / budget * 100 };
      free -= notl; notional += notl; margin += marg;
    } else {
      const qty = Math.floor(p.riskShares * scale);
      if (qty < 1) continue;
      const cost = qty * m.last;
      const own = cost / p.lv;                                  // own funds this position consumes
      if (own > ownFree) continue;
      h = { ...m, lv: p.lv, shares: qty, cost, notional: cost, margin: own, wt: own / av * 100 };
      ownFree -= own; notional += cost; margin += own;
    }
    h.atrPct = m.atr20 / m.last * 100;
    holdings.push(h);
  }
  if (!isFno) free = ownFree;
  const wavg = f => notional > 0 ? holdings.reduce((s, h) => s + (f(h) || 0) * h.notional, 0) / notional : null;
  const avgAtrPct = wavg(h => h.atrPct);
  const avgRS = holdings.some(h => h.rs != null) ? wavg(h => h.rs) : null;
  const held = new Set(holdings.map(h => h.sym));
  const rankedOut = ranked.map((m, i) => ({ ...m, rank: i + 1, hold: held.has(m.sym) }));
  return {
    basket: b, label: BASKET_LABEL[b], ranked: rankedOut, holdings, topN, av, isFno, skipped,
    budget, cash: free, deployed: budget - free, notional, margin, avgAtrPct, avgRS,
    invested: budget - free, maxLev, maxPos: MAX_POSITIONS,
    ownFree: isFno ? av - margin : ownFree,
    grossLev: notional / av
  };
}
function rankedRows() { return computePortfolio().ranked; }
function chartPicks() { return computePortfolio().holdings.slice(0, S.count); }

/* ================= Server snapshot: precomputed by /api/refresh + cron ================= */
async function loadSnapshot() {
  if (S.apiOk === false) return false;
  try {
    const r = await fetch("/api/snapshot", { cache: "no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !j.metrics || Date.now() - j.ts > 6 * 60 * 1000) return false;
    S.metrics = j.metrics; S.metricsTime = j.ts;
    S.snapIntraday = j.intraday || null; S.snapTime = j.ts;
    if (j.index) S.indexInfo = j.index;
    if (j.refVol > 0) REF_VOL = j.refVol; else setRefVol(j.metrics);
    if (j.sectors && Object.keys(j.sectors).length >= 10) setSectors(j.sectors, j.sectorSrc || "NSE");
    try { localStorage.setItem("mp_metrics", JSON.stringify({ m: j.metrics, t: j.ts })) } catch (_) {}
    return true;
  } catch (_) { return false; }
}

/* ================= Refresh cycle ================= */
let busy = false;
async function refresh(force) {
  if (busy) return; busy = true;
  setStatus('<span class="spin"></span>updating…');
  try {
    const snapped = await loadSnapshot();
    if (!snapped) await loadMetrics(force);
    S.rows = rankedRows();
    const picks = chartPicks(S.rows);
    let data;
    if (S.snapIntraday && S.range === "5d" && S.interval === "5m" && S.clip && Date.now() - S.snapTime < 6 * 60 * 1000) {
      data = {};
      for (const p of picks) if (S.snapIntraday[p.sym]) data[p.sym] = S.snapIntraday[p.sym];
      const missing = picks.filter(p => !data[p.sym]).map(p => p.sym);
      if (missing.length) Object.assign(data, await apiMarket(missing, S.range, S.interval));
    } else {
      data = await apiMarket(picks.map(p => p.sym), S.range, S.interval);
    }
    S.charts = data;
    render(picks);
    if (S.view === "insights") renderInsights();
    else if (S.view === "portfolio") renderPortfolio();
    setStatus("updated <b>" + new Date().toLocaleTimeString("en-IN", { hour12: false }) + "</b>" + (S.apiOk ? "" : " · proxy mode"));
  } catch (e) {
    console.error(e);
    if (!pool.size) showMsg("Could not load market data — check connection.", true);
    setStatus('<span style="color:var(--red)">update failed — will retry</span>');
  }
  busy = false;
}

/* ================= Rendering ================= */
function showMsg(t, err) { const m = document.getElementById("msg"); m.style.display = "block"; m.className = err ? "error" : ""; m.textContent = t; }
function setStatus(h) { document.getElementById("status").innerHTML = h; }
const fmt = x => x == null ? "–" : Number(x).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: x >= 1000 ? 0 : 2 });
const pc = x => x == null ? "–" : (x >= 0 ? "+" : "") + x.toFixed(2) + "%";
const cls = x => x == null ? "" : x >= 0 ? "up" : "down";

function fillLayout(n) {
  // Fill the whole viewport: pick the col count whose cells best use the area
  // (aspect closest to ~1.25), then stretch cells to consume every pixel.
  const wrap = document.getElementById("gridWrap");
  const gap = 8, w = wrap.clientWidth - 20, h = wrap.clientHeight - 20;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const cw = (w - (c - 1) * gap) / c, ch = (h - (r - 1) * gap) / r;
    if (cw < 200 || ch < 180) continue;
    const score = Math.abs(Math.log((cw / ch) / 1.25));
    if (!best || score < best.score) best = { cols: c, cellW: Math.floor(cw), cellH: Math.floor(ch), score };
  }
  if (!best) { // very small screens: fixed-height cells, page scrolls
    const c = Math.max(1, Math.floor(w / 240));
    best = { cols: c, cellW: Math.floor((w - (c - 1) * gap) / c), cellH: 240 };
  }
  return best;
}

function seriesData(d) {
  const cd = [], vd = [];
  for (let i = 0; i < d.t.length; i++) {
    if (d.c[i] == null || d.o[i] == null) continue;
    const time = d.t[i] + IST_OFF;
    cd.push({ time, open: d.o[i], high: d.h[i] ?? Math.max(d.o[i], d.c[i]), low: d.l[i] ?? Math.min(d.o[i], d.c[i]), close: d.c[i] });
    vd.push({ time, value: d.v[i] || 0, color: d.c[i] >= d.o[i] ? "rgba(38,166,154,.4)" : "rgba(239,83,80,.4)" });
  }
  return { cd, vd };
}
function smaData(cd, p) {
  const out = []; let sum = 0;
  for (let i = 0; i < cd.length; i++) {
    sum += cd[i].close;
    if (i >= p) sum -= cd[i - p].close;
    if (i >= p - 1) out.push({ time: cd[i].time, value: sum / p });
  }
  return out;
}

function chartOpts(w, h) {
  return {
    width: w, height: h,
    layout: { background: { color: "transparent" }, textColor: "#7d8590", fontSize: 10 },
    grid: { vertLines: { color: "#1a1f28" }, horzLines: { color: "#1a1f28" } },
    rightPriceScale: { borderColor: "#262c36" },
    timeScale: { borderColor: "#262c36", timeVisible: S.interval !== "1d" && S.interval !== "1wk", secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Magnet },
    handleScroll: false, handleScale: false
  };
}

function buildChart(el, w, h) {
  const chart = LightweightCharts.createChart(el, chartOpts(w, h));
  const candles = chart.addCandlestickSeries({ upColor: "#26a69a", downColor: "#ef5350", borderUpColor: "#26a69a", borderDownColor: "#ef5350", wickUpColor: "#26a69a", wickDownColor: "#ef5350" });
  const vol = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  const s20 = chart.addLineSeries({ color: "#f5a623", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  const s50 = chart.addLineSeries({ color: "#2962ff", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  return { chart, candles, vol, s20, s50 };
}
function feedChart(cobj, d) {
  const { cd, vd } = seriesData(d);
  cobj.candles.setData(cd);
  cobj.vol.setData(S.showVol ? vd : []);
  cobj.s20.setData(S.showS20 ? smaData(cd, 20) : []);   // SMAs computed over full
  cobj.s50.setData(S.showS50 ? smaData(cd, 50) : []);   // lookback, shown clipped
  let from = 0;
  if (S.clip && cd.length) {
    const day = t => Math.floor(t / 86400);
    const lastDay = day(cd[cd.length - 1].time);
    from = cd.findIndex(x => day(x.time) === lastDay);
    if (from < 0) from = 0;
  }
  const prevClose = from > 0 ? cd[from - 1].close : d.meta.prevClose;
  if (prevClose != null) {
    if (!cobj._pl) cobj._pl = cobj.candles.createPriceLine({ price: prevClose, color: "#7d8590", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false });
    else cobj._pl.applyOptions({ price: prevClose });
  }
  if (S.clip && from > 0)
    cobj.chart.timeScale().setVisibleRange({ from: cd[from].time, to: cd[cd.length - 1].time });
  else cobj.chart.timeScale().fitContent();
}

function render(picks) {
  const grid = document.getElementById("grid");
  const msg = document.getElementById("msg");
  const avail = picks.filter(p => S.charts[p.sym] && S.charts[p.sym].t && S.charts[p.sym].t.length);
  msg.style.display = avail.length ? "none" : "block";
  const { cols, cellW, cellH } = fillLayout(Math.max(avail.length, 1));
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellW}px)`;
  grid.style.gridAutoRows = `${cellH}px`;

  const want = new Set(avail.map(p => p.sym));
  for (const [sym, obj] of pool) if (!want.has(sym)) { obj.chart.remove(); obj.wrap.remove(); pool.delete(sym); }

  const chartH = cellH - 30;
  for (const p of avail) {
    const d = S.charts[p.sym];
    const chg = d.meta.prevClose && d.meta.last ? (d.meta.last - d.meta.prevClose) / d.meta.prevClose * 100 : p.d1;
    let obj = pool.get(p.sym);
    if (!obj) {
      const wrap = document.createElement("div");
      wrap.className = "card";
      wrap.innerHTML = `<div class="card-head"><span class="sym"></span><span class="ctags"></span><span class="px"></span><span class="chg"></span><button class="max" title="Expand">⤢</button></div><div class="chart-el"></div>`;
      grid.appendChild(wrap);
      obj = buildChart(wrap.querySelector(".chart-el"), cellW - 2, chartH);
      obj.wrap = wrap;
      wrap.querySelector(".max").onclick = () => openModal(p.sym);
      wrap.querySelector(".card-head").ondblclick = () => openModal(p.sym);
      pool.set(p.sym, obj);
    }
    grid.appendChild(obj.wrap); // keeps ranking order
    obj.wrap.querySelector(".sym").textContent = p.sym;
    obj.wrap.querySelector(".ctags").innerHTML = S.metrics[p.sym] ? tagsHtml(S.metrics[p.sym], false) : "";
    obj.wrap.querySelector(".px").textContent = "₹" + fmt(d.meta.last);
    const ce = obj.wrap.querySelector(".chg");
    ce.textContent = (chg >= 0 ? "▲" : "▼") + Math.abs(chg ?? 0).toFixed(2) + "%";
    ce.className = "chg " + cls(chg);
    obj.chart.applyOptions(chartOpts(cellW - 2, chartH));
    feedChart(obj, d);
  }
  renderTable(want);
  renderStrip();
  if (S.modalSym && S.charts[S.modalSym]) feedModal();
}

function renderTable(liveSet) {

/* ================= Insights view ================= */
let SECTORS = {}, SYM_SECTOR = {}, SECTOR_SRC = "bundled";
function setSectors(map, src) {
  SECTORS = map; SECTOR_SRC = src; SYM_SECTOR = {};
  // a stock can sit in several NSE indices; keep the most specific (smallest) one
  const size = s => (SECTORS[s] || []).length;
  for (const [sec, list] of Object.entries(SECTORS))
    for (const s of list)
      if (!SYM_SECTOR[s] || size(sec) < size(SYM_SECTOR[s])) SYM_SECTOR[s] = sec;
}
/* Heat colouring: intensity must reflect the actual grade of the number.
   A fixed scale washes out — 6M returns span ±80% while 1M spans ±15%, so a
   single threshold saturates one column and flattens the other. Each column
   builds its own scale from its own data (90th percentile of |value|), with a
   floor so a flat column doesn't get amplified into noise. */
function makeHeat(values, floor = 4) {
  const a = values.filter(v => v != null).map(Math.abs).sort((x, y) => x - y);
  const p90 = a.length ? a[Math.min(a.length - 1, Math.floor(a.length * 0.9))] : floor;
  const scale = Math.max(p90, floor);
  return v => {
    if (v == null) return "transparent";
    const t = Math.min(Math.abs(v) / scale, 1);        // 0..1 within this column
    const alpha = 0.06 + t * 0.74;                      // faint → strong
    return v >= 0 ? `rgba(38,166,154,${alpha.toFixed(3)})` : `rgba(239,83,80,${alpha.toFixed(3)})`;
  };
}
// fallback fixed-scale heat (used where a column scale isn't meaningful)
const heat = makeHeat([], 12);

/* RS is already a 1-99 grade, so colour it directly on that scale:
   red (weak) → amber (middling) → green (leader). */
function rsColor(rs) {
  if (rs == null) return "var(--muted)";
  const t = Math.max(0, Math.min(1, (rs - 1) / 98));
  return `hsl(${(t * 140).toFixed(0)}, ${(60 + t * 20).toFixed(0)}%, ${(52 + t * 8).toFixed(0)}%)`;
}
const rsCell = rs => `<b style="color:${rsColor(rs)}">${rs ?? "–"}</b>`;
/* ================= Official NSE index screen =================
   1-5 top 25 by 6M/3M/1M/1W/1D  ->  6 keep those in >=3 lists
   7 rank by RS  ->  8 click through to constituents ranked by stock RS      */
/* Index returns are computed from official NSE constituent lists rather than the
   daily-snapshot files. NSE only retains those snapshots for a short window —
   the 1W file exists but the 6M one 404s — so 1M/3M/6M came back null for every
   index and nothing could ever appear in 3 of 5 lists. We already hold a year of
   daily history for every constituent, so every window is computed the same way:
   an equal-weighted mean of member returns. Consistent across all timeframes and
   always available. (NSE's own indices are free-float cap-weighted, so levels
   differ from the headline print; relative ranking is what matters here.) */
const IDX_W = { d1: 0.10, w1: 0.15, m1: 0.30, m3: 0.25, m6: 0.20 };
const IDX_TOP_N = 25, IDX_MIN_HITS = 3;

function computeIndexScreen() {
  const names = Object.keys(SECTORS);
  if (!names.length || !Object.keys(S.metrics).length) return null;
  const rows = [];
  for (const name of names) {
    const mm = (SECTORS[name] || []).map(s => S.metrics[s]).filter(Boolean);
    if (mm.length < 3) continue;
    const avg = f => { const v = mm.map(f).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const r = { index: name, n: mm.length, members: mm,
      d1: avg(m => m.d1), w1: avg(m => m.w1), m1: avg(m => m.m1), m3: avg(m => m.m3), m6: avg(m => m.m6) };
    if ([r.d1, r.w1, r.m1, r.m3, r.m6].filter(x => x != null).length < 3) continue;
    let s = 0, w = 0;
    for (const k of Object.keys(IDX_W)) if (r[k] != null) { s += r[k] * IDX_W[k]; w += IDX_W[k]; }
    r.blend = w > 0 ? s / w : null;
    rows.push(r);
  }
  if (rows.length < 5) return null;

  // 1-5: a top-N list per timeframe
  const tops = {};
  for (const k of Object.keys(IDX_W))
    tops[k] = rows.filter(r => r[k] != null).sort((a, b) => b[k] - a[k]).slice(0, IDX_TOP_N).map(r => r.index);

  // 6: appear in at least MIN_HITS of the five
  const hits = {};
  for (const k of Object.keys(IDX_W)) for (const nm of tops[k]) (hits[nm] = hits[nm] || []).push(k);

  // 7: RS percentiled across EVERY index, not just survivors
  const scale = rows.filter(r => r.blend != null).sort((a, b) => a.blend - b.blend);
  const rsOf = {};
  scale.forEach((r, i) => { rsOf[r.index] = scale.length > 1 ? Math.round(i / (scale.length - 1) * 98) + 1 : 50; });

  const list = rows
    .filter(r => (hits[r.index] || []).length >= IDX_MIN_HITS)
    .map(r => ({ ...r, rs: rsOf[r.index], hits: hits[r.index], hitCount: hits[r.index].length }))
    .sort((a, b) => b.blend - a.blend);

  // rows carries every index so the UI can build a top-25 list per timeframe
  rows.forEach(r => { r.rs = rsOf[r.index]; r.hits = hits[r.index] || []; r.hitCount = (hits[r.index] || []).length; });
  return { rows, list, totalIndices: rows.length, rsBasis: scale.length,
           topN: IDX_TOP_N, minHits: IDX_MIN_HITS, tops };
}

/* Coverage line: NSE lists 155 equity indices; 11 are leveraged/inverse/futures/
   arbitrage/debt variants that make no sense in a growth screen, leaving 144
   usable. Anything short of that is an index NSE publishes no constituent file
   for, so it is stated rather than hidden. */
function coverageNote() {
  const c = S.coverage;
  if (!c) return "";
  const parts = [];
  if (c.pages) parts.push(`${c.pages} index pages scanned`);
  if (c.resolved) parts.push(`${c.resolved} with constituent files`);
  const gaps = [];
  if (c.noFile && c.noFile.length) gaps.push(`${c.noFile.length} publish no constituent list (${c.noFile.slice(0, 4).join(", ")}${c.noFile.length > 4 ? "…" : ""})`);
  if (c.csvFailed && c.csvFailed.length) gaps.push(`${c.csvFailed.length} failed to download`);
  if (c.skipped && c.skipped.length) gaps.push(`${c.skipped.length} excluded as leveraged/inverse/futures/debt variants`);
  return `<br><span style="color:var(--muted)">Coverage: ${parts.join(" · ")}${gaps.length ? " · " + gaps.join(" · ") : ""}.</span>`;
}

function loadNseIndices() {
  const res = computeIndexScreen();
  if (res) { S.nseIdx = res; S.nseErr = null; }
  else S.nseErr = "Waiting for index constituents and price data…";
}

async function openIndex(name) {
  S.selIdx = name; S.selSyms = null; S.selErr = null;
  renderInsights();
  try {
    // hard timeout — a hanging upstream must surface as an error, not a spinner
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 25000);
    let r;
    try {
      r = await fetch(`/api/index-constituents?index=${encodeURIComponent(name)}`,
        { cache: "no-store", signal: ac.signal });
    } finally { clearTimeout(t); }
    if (!r.ok) {
      let msg = "NSE does not publish a constituent file for this index.";
      try { const e = await r.json(); if (e.error) msg = e.error; } catch (_) {}
      S.selErr = msg; renderInsights(); return;
    }
    const j = await r.json();
    S.selSyms = j.symbols || [];
    S.selFile = j.file || null;
    if (!S.selSyms.length) { S.selErr = "Constituent file was empty."; renderInsights(); return; }
    renderInsights();                      // show the list immediately…
    // price anything we don't already have, so RS is available for every member
    const missing = S.selSyms.filter(s => !S.metrics[s]);
    if (missing.length) {
      const d = await apiMarket(missing, "1y", "1d");
      const add = {};
      for (const [sym, x] of Object.entries(d)) {
        const cl = [], hh = [], ll = [], vv = [], oo = [];
        for (let i = 0; i < x.c.length; i++) if (x.c[i] != null) {
          cl.push(x.c[i]); hh.push(x.h[i] ?? x.c[i]); ll.push(x.l[i] ?? x.c[i]); vv.push(x.v[i] || 0); oo.push(x.o[i] ?? x.c[i]);
        }
        if (cl.length < 30) continue;
        const last = x.meta.last ?? cl[cl.length - 1], prev = cl[cl.length - 2];
        add[sym] = {
          sym, last, name: x.meta.name,
          d1: prev ? (last - prev) / prev * 100 : null,
          w1: pctBack(cl, 5), m1: pctBack(cl, 21), m3: pctBack(cl, 63), m6: pctBack(cl, 126), y1: pctBack(cl, 251),
          rsi: rsi14(cl), vol: volOf(cl), ...momoExtras(cl, hh, ll, oo)
        };
        add[sym].rsRaw = rsRawOf(add[sym]);
        add[sym].atrPct = add[sym].atr20 && last ? add[sym].atr20 / last * 100 : null;
      }
      scoreIntoBasis(add);              // score against the fixed basis, shift nobody
      Object.assign(S.metrics, add);
    }
  } catch (e) {
    S.selErr = e && e.name === "AbortError"
      ? "Timed out fetching constituents from NSE — try again."
      : String(e);
  }
  renderInsights();                     // …then again once prices are in
}

/* ================= Insights: official NSE index screen only ================= */
function renderInsights() {
  const ms = Object.values(S.metrics);
  const el = document.getElementById("insights");
  const N = v => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
  const num = (v, d = 2) => v == null ? "–" : v.toFixed(d);
  loadNseIndices();                     // cheap: recomputed from data already loaded

  // ---- 1-7: strongest indices across timeframes ----------------------------
  const NI = S.nseIdx;
  const nseCard = (() => {
    if (!NI) return `<div class="ins-card wide"><h3>Strongest NSE Indices</h3>
      <div style="font-size:11px;color:var(--muted)"><span class="spin"></span>
      ${S.nseErr || "Loading NSE index constituents and prices…"}
      (${Object.keys(SECTORS).length} indices · ${Object.keys(S.metrics).length} stocks priced)</div></div>`;

    const TF = [
      { k: "hits", lbl: "Strong", sub: `≥${NI.minHits} of 5` },
      { k: "d1", lbl: "1 Day", sub: `top ${NI.topN}` },
      { k: "w1", lbl: "1 Week", sub: `top ${NI.topN}` },
      { k: "m1", lbl: "1 Month", sub: `top ${NI.topN}` },
      { k: "m3", lbl: "3 Month", sub: `top ${NI.topN}` },
      { k: "m6", lbl: "6 Month", sub: `top ${NI.topN}` }
    ];
    const view = S.idxView || "hits";
    const active = view === "hits" ? null : view;
    // survivors list, or a straight top-25 for the chosen timeframe
    const L = view === "hits" ? NI.list
      : NI.rows.filter(r => r[view] != null).sort((a, b) => b[view] - a[view]).slice(0, NI.topN);
    const bar = `<div class="filterbar">${TF.map(t =>
      `<button class="fb${view === t.k ? " on" : ""}" data-tf="${t.k}">${t.lbl}<span class="sub">${t.sub}</span></button>`).join("")}</div>`;
    const caption = view === "hits"
      ? `Indices in the top ${NI.topN} of at least ${NI.minHits} of the five timeframes — sustained strength, not a single hot window.`
      : `Top ${NI.topN} indices by <b style="color:var(--accent)">${TF.find(t => t.k === view).lbl}</b> growth alone. The <b>In</b> column still shows how many of the five lists each one made.`;
    const ac = k => k === active ? " class=\"active\"" : "";
    // scale colours off ALL indices, not the visible subset, so a cell's shade
    // means the same thing whichever filter you are on
    const hc = (k, f) => makeHeat(NI.rows.map(r => r[k]), f);
    const H1 = hc("d1", 1.5), H2 = hc("w1", 3), H3 = hc("m1", 6), H4 = hc("m3", 10), H5 = hc("m6", 15);
    return `<div class="ins-card wide" style="border-color:var(--green)">
      <h3 style="color:var(--green)">Strongest NSE Indices</h3>
      ${bar}
      <div style="font-size:10px;color:var(--muted);margin:0 0 8px;line-height:1.5">
        ${caption}<br>
        ${NI.totalIndices} official NSE indices${S.sectorSrc === "nse-discovered" ? " · auto-discovered, new ones appear on their own" : ""} ·
        equal-weighted from NSE's constituent lists · <b style="color:var(--text)">RS is a percentile across all ${NI.rsBasis || NI.totalIndices} indices</b>.
        <b style="color:var(--text)">Tap a row</b> for constituents ranked by stock RS.
        ${coverageNote()}
      </div>
      <div class="tblscroll"><table class="rot"><thead><tr><th>#</th><th style="text-align:left">Index</th><th>RS</th><th class="m-hide">In</th>
        <th${ac("d1")}>1D</th><th${ac("w1")}>1W</th><th${ac("m1")}>1M</th><th${ac("m3")}>3M</th><th${ac("m6")}>6M</th></tr></thead>
      <tbody>${L.length ? L.map((r, i) => `<tr data-idx="${encodeURIComponent(r.index)}" style="cursor:pointer${S.selIdx === r.index ? ";background:var(--hl)" : ""}">
        <td>${i + 1}</td>
        <td style="text-align:left"><b style="color:${S.selIdx === r.index ? "var(--accent)" : "var(--text)"}">${r.index.replace(/^NIFTY /, "")}</b></td>
        <td>${rsCell(r.rs)}</td>
        <td class="m-hide"><b>${r.hitCount}</b><span style="color:var(--muted)">/5</span></td>
        <td${ac("d1")} style="background:${H1(r.d1)}">${N(r.d1)}</td>
        <td${ac("w1")} style="background:${H2(r.w1)}">${N(r.w1)}</td>
        <td${ac("m1")} style="background:${H3(r.m1)}">${N(r.m1)}</td>
        <td${ac("m3")} style="background:${H4(r.m3)}">${N(r.m3)}</td>
        <td${ac("m6")} style="background:${H5(r.m6)}">${N(r.m6)}</td></tr>`).join("")
        : `<tr><td colspan="9" style="color:var(--muted)">No index is strong across ≥${NI.minHits} timeframes right now.</td></tr>`}</tbody></table></div>
    </div>`;
  })();

  // ---- 8: constituents of the clicked index, ranked by stock RS ------------
  const constCard = (() => {
    if (!S.selIdx) return "";
    const head = `<h3 style="color:var(--accent)">${S.selIdx} — constituents by RS</h3>`;
    if (S.selErr) return `<div class="ins-card wide" style="border-color:var(--accent)">${head}
      <div style="font-size:11px;color:var(--red)">${S.selErr}</div></div>`;
    if (!S.selSyms) return `<div class="ins-card wide" style="border-color:var(--accent)">${head}
      <div style="font-size:11px;color:var(--muted)"><span class="spin"></span>Loading constituents…</div></div>`;
    const mem = S.selSyms.map(s => S.metrics[s]).filter(m => m && m.rs != null).sort((a, b) => b.rs - a.rs);
    const miss = S.selSyms.length - mem.length;
    if (!mem.length) return `<div class="ins-card wide" style="border-color:var(--accent)">${head}
      <div style="font-size:11px;color:var(--muted)"><span class="spin"></span>Pricing ${S.selSyms.length} constituents…</div></div>`;
    const hW = makeHeat(mem.map(x => x.w1), 3), h1 = makeHeat(mem.map(x => x.m1), 5),
          h3 = makeHeat(mem.map(x => x.m3), 10), h6 = makeHeat(mem.map(x => x.m6), 15);
    return `<div class="ins-card wide" style="border-color:var(--accent)">${head}
      <div style="font-size:10px;color:var(--muted);margin:-6px 0 8px">
        ${mem.length} of ${S.selSyms.length} constituents priced${miss ? ` · ${miss} without data` : ""} · ranked by stock RS.
        Tags: <span class="tag vcp">F&amp;O</span> derivatives-eligible, <span class="tag pb">n×</span> Zerodha MTF leverage.
      </div>
      <div class="tblscroll"><table class="rot"><thead><tr><th>#</th><th style="text-align:left">Symbol</th><th>LTP</th><th>RS</th>
        <th class="m-hide">1D</th><th class="m-hide">1W</th><th>1M</th><th>3M</th><th>6M</th><th class="m-hide">ATR%</th><th class="m-hide">Momo</th></tr></thead>
      <tbody>${mem.map((m, i) => `<tr>
        <td>${i + 1}</td>
        <td style="text-align:left"><b>${m.sym}</b>${S.lots[m.sym] ? '<span class="tag vcp" style="margin-left:4px">F&amp;O</span>' : ""}${S.mtfLev[m.sym] ? `<span class="tag pb" style="margin-left:3px">${S.mtfLev[m.sym]}×</span>` : ""}</td>
        <td>${fmt(m.last)}</td><td>${rsCell(m.rs)}</td>
        <td class="m-hide ${cls(m.d1)}">${pc(m.d1)}</td>
        <td class="m-hide" style="background:${hW(m.w1)}">${N(m.w1)}</td>
        <td style="background:${h1(m.m1)}">${N(m.m1)}</td>
        <td style="background:${h3(m.m3)}">${N(m.m3)}</td>
        <td style="background:${h6(m.m6)}">${N(m.m6)}</td>
        <td class="m-hide" style="color:#f5a623">${num(m.atrPct)}%</td>
        <td class="m-hide" style="color:var(--accent)">${num(m.momo, 0)}</td></tr>`).join("")}</tbody></table></div>
    </div>`;
  })();

  el.innerHTML = `<div class="ins-grid">${nseCard}${constCard}</div>`;
  el.querySelectorAll("tr[data-idx]").forEach(tr =>
    tr.onclick = () => openIndex(decodeURIComponent(tr.dataset.idx)));
  el.querySelectorAll(".fb[data-tf]").forEach(b =>
    b.onclick = () => {
      S.idxView = b.dataset.tf;
      try { localStorage.setItem("mp_idxview", S.idxView) } catch (_) {}
      renderInsights();
    });
}

function feedModal() {
  const sym = S.modalSym, d = S.charts[sym];
  if (!d) return;

async function ensureIndexInfo() {
  if (S.indexInfo || S.idxBusy) return;

    const d = (await apiMarket(["^NSEI"], "1y", "1d"))["^NSEI"];

      const cl = d.c.filter(x => x != null);
      const s200 = cl.length >= 200 ? cl.slice(-200).reduce((a, b) => a + b, 0) / 200 : null;
      const last = d.meta.last ?? cl[cl.length - 1];
      S.indexInfo = { last, sma200: s200, positive: s200 != null ? last > s200 : null };
      if (S.view === "portfolio") renderPortfolio();
    }
  } catch (_) {}
  S.idxBusy = false;
}

const P2 = v => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(1);

const cr = v => "₹" + (Math.abs(v) >= 1e7 ? (v / 1e7).toFixed(2) + " cr" : (v / 1e5).toFixed(2) + " L");

    <td style="text-align:right">₹${fmt(Math.round(m.notional))}</td>
    <td style="text-align:right;color:var(--muted)">₹${fmt(Math.round(m.margin))}</td>

    <td class="${m.gap90 <= 15 ? "qy" : "qn"}" style="text-align:right">${m.gap90 == null ? "–" : m.gap90.toFixed(1) + "%"}</td>

  const stat = (lbl, val, hi) => `<span style="margin-right:20px;font-size:11px;color:var(--muted)">${lbl} <b style="color:${hi || "var(--text)"};font-size:13px">${val}</b></span>`;
  const summary = p.isFno

      stat("Total LOTS", totalLots, "var(--accent)") +

function renderPortfolio() {
  const el = document.getElementById("portfolio");
  if (!Object.keys(S.metrics).length) { el.innerHTML = '<div id="msg"><span class="spin"></span>Loading…</div>'; return; }
  if (!S.indexInfo) ensureIndexInfo();
  const idx = S.indexInfo;
  const idxHtml = idx == null
    ? '<span class="idxbadge">Checking Nifty trend…</span>'
    : idx.positive
      ? `<span class="idxbadge ok">NIFTY ${fmt(idx.last)} &gt; 200 DMA ${fmt(idx.sma200)} — new buys allowed</span>`
      : `<span class="idxbadge no">NIFTY ${fmt(idx.last)} &lt; 200 DMA ${fmt(idx.sma200)} — index filter negative: no new buys, sells only</span>`;
  const fno = computePortfolio("fno"), mtf = computePortfolio("mtf");
  el.innerHTML = `<div class="ins-grid">
    <div class="ins-card wide" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <h3 style="margin:0">Weekly Rebalance — two portfolios, one strategy</h3>
      ${idxHtml}
      <span style="margin-left:auto;font-size:11px;color:var(--muted)">Set each basket's capital in the toolbar (switch F&amp;O / MTF)</span>
    </div>
    ${basketBlock(fno)}
    ${basketBlock(mtf)}
    <div class="ins-card wide" style="font-size:10px;color:var(--muted);line-height:1.6">
      <b style="color:var(--text)">Shared rules:</b> rank by annualized 90-day exponential regression slope × R²; take only the top <b>${MAX_POSITIONS}</b> qualifying names from the top 20% of that basket's ranking;
      position weights come from ATR risk parity and are then scaled uniformly so the capital is fully deployed across those ${MAX_POSITIONS};
      <b style="color:var(--text)">RS</b> = ${(RS_W.m1 * 100)}% 1M + ${(RS_W.m3 * 100)}% 3M + ${(RS_W.m6 * 100)}% 6M growth, percentile-ranked 1–99 against the entire ${Object.keys(S.metrics).length}-stock universe
      (50 = median stock, 90 = stronger than 90% of the market). Portfolio Avg ATR% and Avg RS are exposure-weighted;
      disqualify anything below its 100 DMA or with a 90-day gap &gt; 15%; risk-size each position as Capital × 0.001 / ATR20 (10 bps daily risk per position);
      open new positions only when NIFTY is above its 200 DMA.<br>
      <b style="color:var(--text)">Sizing base:</b> positions are risk-sized against <i>buying power</i>, not bare capital, so the leverage actually gets deployed.
      F&amp;O notional capacity = capital ÷ ${S.marginPct}% margin; MTF buying power = capital × the highest leverage available in the basket. Risk is 10 bps of that exposure per position.<br>
      <b style="color:var(--text)">F&amp;O:</b> the risk-sized quantity is rounded to the nearest whole <b>lot</b>. If even one lot would exceed the risk unit the name is
      <b>skipped</b> rather than force-bought — with small capital many large-lot stocks drop out, which is the honest answer. Lot sizes are the NSE Aug-2026 cycle; re-check after each NSE revision.<br>
      <b style="color:var(--text)">MTF:</b> ${S.minMtfLev}× is a <i>universe filter</i> — a stock is only eligible if the broker offers at least ${S.minMtfLev}× on it — and every position is then
      taken at that stock's own maximum leverage (the Lev column). Own funds are the binding constraint, so exposure = Σ(position ÷ its leverage) ≤ your capital.
      Risk per position is 10 bps of exposure, meaning leverage amplifies drawdown as well as exposure. Interest on the borrowed portion is not modelled.
      ${S.mtfLevExact ? "" : `<b style="color:var(--red)">Per-stock leverage is currently the ${S.mtfLevDefault}× default — load your broker's MTF list for real numbers.</b>`}<br>
      Educational screening tool — not investment advice.
    </div>
  </div>`;
}

<p>${idx ? (idx.positive
   ? `<b style="color:#0a7d5c">NIFTY ${F(idx.last)} is ABOVE its 200 DMA (${F(idx.sma200)}) — new buys allowed in both portfolios.</b>`
   : `<b style="color:#c0392b">NIFTY ${F(idx.last)} is BELOW its 200 DMA (${F(idx.sma200)}) — no new buys this week in either portfolio. Sell exits only.</b>`) : "Index trend unavailable."}</p>

${block(pm)}
<p class="sub">Sizing: shares = Capital × 0.001 / ATR20. In each portfolio, sell anything you hold that is absent from its list; buy new names only if the index filter above is positive. The two baskets are ranked and sized independently.</p>

/* ================= Market status ================= */
function marketStatus() {
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
  const day = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
  const open = day >= 1 && day <= 5 && mins >= 555 && mins <= 930;
  const b = document.getElementById("mktBadge");
  b.textContent = open ? "● NSE OPEN" : "NSE CLOSED";
  b.className = "badge" + (open ? " open" : "");
}

/* ================= Wiring ================= */
function schedule() { clearInterval(S.timer); S.timer = setInterval(() => { if (!document.hidden) refresh(); }, S.refreshSec * 1000); }
let rT;
function init() {
  const countSel = document.getElementById("count");
  for (let i = 1; i <= MAX_CHARTS; i++) countSel.add(new Option(i, i));
  countSel.value = S.count;

  document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#viewSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    S.view = b.dataset.v;
    document.getElementById("gridWrap").style.display = S.view === "charts" ? "block" : "none";
    document.getElementById("insights").style.display = S.view === "insights" ? "block" : "none";
    document.getElementById("portfolio").style.display = S.view === "portfolio" ? "block" : "none";
    if (S.view === "insights") renderInsights();
    else if (S.view === "portfolio") renderPortfolio();
    else render(chartPicks(S.rows));
  });
  countSel.onchange = e => { S.count = +e.target.value; refresh(); };
  document.querySelectorAll("#tf button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tf button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const parts = b.dataset.v.split("|");
    S.range = parts[0]; S.interval = parts[1]; S.clip = !!parts[2];
    S.charts = {}; refresh();
  });
  for (const [id, key] of [["tglVol", "showVol"], ["tglS20", "showS20"], ["tglS50", "showS50"]]) {
    document.getElementById(id).onclick = e => {
      S[key] = !S[key];
      e.target.classList.toggle("on", S[key]);
      render(chartPicks(S.rows));
    };
  }
  document.getElementById("interval").onchange = e => { S.refreshSec = +e.target.value; schedule(); };
  const avTop = document.getElementById("avTop");
  const syncAv = () => { avTop.value = S.acct[S.basket].toLocaleString("en-IN"); };
  avTop.onchange = e => {
    const v = parseInt(e.target.value.replace(/[^0-9]/g, ""), 10);
    if (!(v > 0)) { syncAv(); return; }
    S.acct[S.basket] = v;
    try { localStorage.setItem("mp_acct", JSON.stringify(S.acct)) } catch (_) {}
    syncAv();
    S.rows = rankedRows(); renderTable(new Set([...pool.keys()])); renderStrip();
    if (S.view === "portfolio") renderPortfolio(); else if (S.view === "charts") refresh();
  };
  const lvSel = document.getElementById("lvSel");
  const syncLv = () => {
    const fno = S.basket === "fno";
    document.getElementById("lvBox").style.display = fno ? "flex" : "none";
    document.getElementById("lvLabel").textContent = "F&O margin %";
    if (fno && !lvSel.options.length) {
      for (const v of [12, 15, 18, 20, 25, 30, 40]) lvSel.add(new Option(v + "%", v));
    }
    lvSel.value = S.marginPct;
  };
  const repaint = () => {
    S.rows = rankedRows(); renderTable(new Set([...pool.keys()])); renderStrip();
    if (S.view === "portfolio") renderPortfolio(); else if (S.view === "charts") refresh();
  };
  lvSel.onchange = e => {
    const v = parseFloat(e.target.value);
    if (v > 0) S.marginPct = v;
    try { localStorage.setItem("mp_lev", JSON.stringify({ m: S.marginPct })) } catch (_) {}
    repaint();
  };
  document.querySelectorAll("#basketSeg button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#basketSeg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    S.basket = b.dataset.b;
    try { localStorage.setItem("mp_basket", S.basket) } catch (_) {}
    syncAv(); syncLv(); repaint();
  });
  document.getElementById("btnReport").onclick = buildReport;
  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  try {   // instant paint from cached metrics while fresh data loads
    const snap = JSON.parse(localStorage.getItem("mp_metrics") || "null");
    if (snap && snap.m) { S.metrics = snap.m; S.rows = rankedRows(); renderTable(); renderStrip(); }
    const a = JSON.parse(localStorage.getItem("mp_acct") || "null");
    if (a && a.fno > 0 && a.mtf > 0) S.acct = a;
    else { const old = parseInt(localStorage.getItem("mp_av") || "0", 10); if (old > 0) S.acct = { fno: old, mtf: old }; }
    const iv = localStorage.getItem("mp_idxview");
    if (iv) S.idxView = iv;
    const bk = localStorage.getItem("mp_basket");
    if (bk === "fno" || bk === "mtf") {
      S.basket = bk;
      document.querySelectorAll("#basketSeg button").forEach(x => x.classList.toggle("on", x.dataset.b === bk));
    }
  } catch (_) {}

  window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => render(chartPicks(S.rows)), 200); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  try {
    const lv = JSON.parse(localStorage.getItem("mp_lev") || "null");
    if (lv && lv.m > 0) S.marginPct = lv.m;
  } catch (_) {}
  syncAv(); syncLv();
  marketStatus(); setInterval(marketStatus, 30000);
  loadUniverse().then(() => { ensureIndexInfo(); refresh(); schedule(); });
}
init();
</script>
</body>
</html>
